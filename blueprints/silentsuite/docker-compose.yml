# SilentSuite for Dokploy: end-to-end encrypted calendar, contacts, tasks and notes.
#
# Only the router ("silentsuite") gets a Dokploy domain. Every name the router or the
# server resolves starts with "silentsuite-", so services that other stacks expose on
# the shared dokploy-network under generic names (server, web, postgres) are never
# reached. Switch the domain to HTTPS before the first signup: browser signup needs
# HTTPS (secure context, and the owner login refuses http:// origins).
#
# The three secrets come from template.toml (Dokploy's crypto-random hash helper).
# ":?" stops the stack when one is unset or empty, so it never starts with open signup.

services:
  silentsuite:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ../files/silentsuite/router.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx resolves its upstreams once at start. "restart: true" restarts the router whenever
    # Compose recreates web or server (for example on an image update), so it never keeps
    # proxying to a replaced container's old address.
    depends_on:
      silentsuite-web:
        condition: service_started
        restart: true
      silentsuite-server:
        condition: service_healthy
        restart: true

  silentsuite-web:
    image: ghcr.io/silent-suite/silentsuite-web-selfhost:v0.5.22-beta@sha256:0684fdde0c71e5b849c10f5f4992b307cabf19f311fa865d9cda5939e1bc4cb2
    restart: unless-stopped
    expose:
      - "3000"

  silentsuite-init:
    # One-shot: gives the server image's user its data directories and writes the
    # private server INI with the database password. It makes no network calls.
    image: ghcr.io/silent-suite/silentsuite-server:v0.5.22-beta@sha256:e6db5a437a7c5ec6d64289037ab1dce19616ea5feee9cee068fe91c2a39130a0
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/init.sh"]
    environment:
      DATABASE_PASSWORD: ${SILENTSUITE_DB_PASSWORD:?SILENTSUITE_DB_PASSWORD must be set}
    volumes:
      - ../files/silentsuite/init.sh:/bootstrap/init.sh:ro
      - silentsuite-server-data:/data
      - silentsuite-server-config:/config

  silentsuite-server:
    image: ghcr.io/silent-suite/silentsuite-server:v0.5.22-beta@sha256:e6db5a437a7c5ec6d64289037ab1dce19616ea5feee9cee068fe91c2a39130a0
    restart: unless-stopped
    # Same collectstatic/migrate/uvicorn lifecycle as the image entrypoint, with
    # access logging off and a private umask for first-boot files.
    entrypoint: ["/bin/sh", "/bootstrap/server-start.sh"]
    expose:
      - "3735"
    depends_on:
      silentsuite-init:
        condition: service_completed_successfully
      silentsuite-postgres:
        condition: service_healthy
    environment:
      ETEBASE_EASY_CONFIG_PATH: /etc/etebase-server/etebase-server.ini
      ETEBASE_OWNER_PASSWORD: ${SILENTSUITE_INSTALLATION_PASSWORD:?SILENTSUITE_INSTALLATION_PASSWORD must be set}
      ETEBASE_REGISTRATION_TOKEN: ${SILENTSUITE_REGISTRATION_SIGNING:?SILENTSUITE_REGISTRATION_SIGNING must be set}
      ETEBASE_DISABLE_DJANGO_ADMIN: "true"
      CORS_ALLOWED_ORIGINS: ""
      # TLS ends at Dokploy's Traefik; the router reaches the server over the stack network.
      ETEBASE_SECURE_SSL_REDIRECT: "false"
    volumes:
      - ../files/silentsuite/server-start.sh:/bootstrap/server-start.sh:ro
      - silentsuite-server-data:/data
      - silentsuite-server-config:/etc/etebase-server:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('localhost',3735,timeout=5); c.request('GET','/api/v1/authentication/is_etebase/'); sys.exit(0 if c.getresponse().status<500 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  silentsuite-postgres:
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: silentsuite
      POSTGRES_USER: silentsuite
      POSTGRES_PASSWORD: ${SILENTSUITE_DB_PASSWORD:?SILENTSUITE_DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - silentsuite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "silentsuite", "-d", "silentsuite"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  silentsuite-postgres-data: {}
  silentsuite-server-data: {}
  silentsuite-server-config: {}
