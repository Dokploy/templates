version: "3.8"
services:
  kavel-image-starter:
    image: san8888/kavel-image-starter:1.0.0
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - PORT=3000
      - KAVEL_API_KEY=${KAVEL_API_KEY}
      - KAVEL_MODEL=${KAVEL_MODEL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
