[[config.mounts]]
filePath = "mongo-init.js"
content = """// mongo-init.js

const adminDb = db.getSiblingDB('admin');

const username = process.env.MONGO_INITDB_USERNAME;
const password = process.env.MONGO_INITDB_PASSWORD;
const database = process.env.MONGO_INITDB_DATABASE;

// Idempotent: the official entrypoint races the real server on port 27017 when
// initialising a fresh volume (appwrite/appwrite#13593), so this script may run
// more than once. Skip if the user already exists.
if (adminDb.getUser(username) === null) {
  adminDb.createUser({
    user: username,
    pwd: password,
    roles: [
      { role: 'readWrite', db: database }
    ]
  });
}
"""

[[config.mounts]]
filePath = "mongo-entrypoint.sh"
content = """#!/bin/bash
set -e

KEYFILE_PATH="/data/keyfile/mongo-keyfile"

if [ ! -f "$KEYFILE_PATH" ]; then
  echo "Generating random MongoDB keyfile..."
  mkdir -p /data/keyfile
  openssl rand -base64 756 > "$KEYFILE_PATH"
fi

chmod 400 "$KEYFILE_PATH"
chown mongodb:mongodb "$KEYFILE_PATH" 2>/dev/null || chown 999:999 "$KEYFILE_PATH"

# The standard entrypoint initialises an empty data directory with a second
# mongod on 27017, stopped with `mongod --shutdown`. That returns once the
# server clears <dbpath>/mongod.lock, several steps before it exits and
# releases the port, and the real server binds a millisecond after it starts --
# so a slow shutdown tail leaves it exiting 48, "Address already in use",
# taking the container with it (appwrite/appwrite#13593). Initialise here
# instead, on a port the real server never binds, and hand over a directory
# the standard entrypoint has nothing left to do.
INIT_MARKER=/data/db/.appwrite-initialised
if [ ! -e "$INIT_MARKER" ]; then
  INIT_PORT=27018
  echo "Initialising MongoDB data directory..."
  find -L /data/db \! -user mongodb -exec chown mongodb '{}' +
  export MONGO_INITDB_DATABASE="${MONGO_INITDB_DATABASE:-test}"
  gosu mongodb mongod --dbpath /data/db --bind_ip 127.0.0.1 --port "$INIT_PORT" &
  INIT_SERVER=$!
  READY=
  for _ in $(seq 1 30); do
    if mongosh --host 127.0.0.1 --port "$INIT_PORT" --quiet --eval 'quit(0)' > /dev/null 2>&1; then
      READY=1
      break
    fi
    if ! kill -0 "$INIT_SERVER" 2>/dev/null; then
      break
    fi
    sleep 1
  done
  if [ -z "$READY" ]; then
    echo "MongoDB did not accept connections for initialisation" >&2
    exit 1
  fi
  mongosh --host 127.0.0.1 --port "$INIT_PORT" --quiet admin --eval '
    const username = process.env.MONGO_INITDB_ROOT_USERNAME;
    if (db.getUser(username) === null) {
      db.createUser({
        user: username,
        pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
        roles: [{ role: "root", db: "admin" }]
      });
    }
  '
  mongosh --host 127.0.0.1 --port "$INIT_PORT" --quiet "$MONGO_INITDB_DATABASE" /mongo-init.js
  touch "$INIT_MARKER"
  kill -TERM "$INIT_SERVER"
  wait "$INIT_SERVER"
  echo "MongoDB data directory initialised."
fi

exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile "$KEYFILE_PATH"
"""

# --- Main domain: API + Console (kept for backwards compatibility) ---
[[config.domains]]
serviceName = "appwrite-console"
port = 3000
host = "${main_domain}"
path = "/"

[[config.domains]]
serviceName = "appwrite"
port = 80
host = "${main_domain}"
path = "/v1"

[[config.domains]]
serviceName = "appwrite"
port = 80
host = "${main_domain}"
path = "/.well-known"

[[config.domains]]
serviceName = "appwrite-realtime"
port = 80
host = "${main_domain}"
path = "/v1/realtime"

# --- Dedicated Console domain ---
# The Console SPA is served at the root of ${console_domain}. Requests to
# /v1 and /v1/realtime on that same host are proxied to the API and Realtime
# services so the Console reaches the API on its own origin. No wildcard is
# used here; Sites and Functions keep their own wildcard hosts below.
[[config.domains]]
serviceName = "appwrite-console"
port = 3000
host = "${console_domain}"
path = "/"

[[config.domains]]
serviceName = "appwrite"
port = 80
host = "${console_domain}"
path = "/v1"

[[config.domains]]
serviceName = "appwrite-realtime"
port = 80
host = "${console_domain}"
path = "/v1/realtime"

# --- Sites and Functions (wildcards handled by Traefik HostRegexp labels) ---
[[config.domains]]
serviceName = "appwrite"
port = 80
host = "${sites_domain}"
path = "/"

[[config.domains]]
serviceName = "appwrite"
port = 80
host = "${functions_domain}"
path = "/"
