  appwrite-task-scheduler-functions:
    profiles:
      - separate
    entrypoint: schedule-functions
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    image: appwrite/appwrite:2.3.0
    depends_on:
