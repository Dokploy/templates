services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KORTIX_SECRET_SEED: ${KORTIX_SECRET_SEED}
      PGDATA: /var/lib/postgresql/data/pgdata
      KORTIX_ROLE: db
      KORTIX_BOOT: 
    volumes:
    - kortix-db-data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres && PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U supabase_auth_admin -d postgres -tAc 'select 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1280m
  auth:
    image: supabase/gotrue:v2.189.0@sha256:385184459f57569c54c25209f51f3b2be99ddd7c4ce9e3555b5d3eea8447b7cf
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KORTIX_SECRET_SEED: ${KORTIX_SECRET_SEED}
      DB_HOST: db
      API_HOST: api
      EMAIL_URL: ${EMAIL_URL:-}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: kortix://**
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: '0'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_SMS_AUTOCONFIRM: 'false'
      GOTRUE_SAML_ENABLED: 'false'
      GOTRUE_SMTP_ADMIN_EMAIL: admin@localhost
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: '587'
      GOTRUE_SMTP_USER: unused
      GOTRUE_SMTP_PASS: unused
      GOTRUE_SMTP_SENDER_NAME: Kortix
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '30'
      GOTRUE_RATE_LIMIT_SMS_SENT: '30'
      GOTRUE_RATE_LIMIT_VERIFY: '30'
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: '150'
      GOTRUE_RATE_LIMIT_OTP: '30'
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: '30'
      KORTIX_ROLE: auth
      KORTIX_BOOT: 
    expose:
    - '9999'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:9999/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    mem_limit: 256m
  rest:
    image: postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
    restart: unless-stopped
    command:
    - postgrest
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: '3001'
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: '3600'
    expose:
    - '3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - postgrest
      - --ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
  storage:
    image: supabase/storage-api:v1.60.4@sha256:c8eb9858eafec891a97c27125470aaad54703c3f4eb4d55ca7f1bf6c6411febf
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KORTIX_SECRET_SEED: ${KORTIX_SECRET_SEED}
      DB_HOST: db
      REST_HOST: rest
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: kortix-storage
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: kortix-default
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
      KORTIX_ROLE: storage
      KORTIX_BOOT: 
    volumes:
    - kortix-storage-data:/var/lib/storage
    expose:
    - '5000'
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:5000/status
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    mem_limit: 384m
  kong:
    image: kong/kong:3.9.1@sha256:6addf50e6bd8d578314cb9ce4f2d2d1e3781d2edecef59f707e00c6e05d384f5
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      JWT_SECRET: ${JWT_SECRET}
      KORTIX_SECRET_SEED: ${KORTIX_SECRET_SEED}
      AUTH_HOST: auth
      REST_HOST: rest
      STORAGE_HOST: storage
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: '1'
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      KONG_NGINX_WORKER_PROCESSES: '2'
      KORTIX_ROLE: kong
      KORTIX_BOOT: 
    expose:
    - '8000'
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - kong
      - health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 384m
  api:
    image: kortix/kortix-api:0.14.19
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KORTIX_SECRET_SEED: ${KORTIX_SECRET_SEED}
      DB_HOST: db
      AUTH_HOST: auth
      KONG_HOST: kong
      GATEWAY_HOST: gateway
      PORT: '8008'
      PUBLIC_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      PLATINUM_API_KEY: ${PLATINUM_API_KEY}
      KORTIX_PLATFORM_ADMIN_EMAILS: ${KORTIX_ADMIN_EMAIL}
      EMAIL_URL: ${EMAIL_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      ALLOWED_SANDBOX_PROVIDERS: platinum
      PLATINUM_API_URL: https://api.platinum.dev
      DAYTONA_SERVER_URL: https://app.daytona.io/api
      DAYTONA_TARGET: us
      ENTERPRISE_LICENSE_AVAILABLE: 'false'
      KORTIX_BILLING_INTERNAL_ENABLED: 'false'
      KORTIX_RESTRICT_ACCOUNT_CREATION: 'true'
      KORTIX_PUBLIC_AUTH_PROVIDERS: ''
      KORTIX_ROUTER_INTERNAL_ENABLED: 'false'
      MANAGED_GIT_PROVIDER: github
      CONNECTOR_AUTH_PROVIDER: composio
      PIPEDREAM_ENVIRONMENT: production
      KORTIX_VERSION: 0.14.19
      KORTIX_CONFIG_ARCHIVE_S3_BUCKET: kortix-config-releases
      KORTIX_CONFIG_ARCHIVE_S3_REGION: local
      KORTIX_CONFIG_ARCHIVE_S3_FORCE_PATH_STYLE: 'true'
      KORTIX_ROLE: api
      KORTIX_BOOT: 
    expose:
    - '8008'
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - 'bun -e "fetch(''http://127.0.0.1:8008/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    mem_limit: 2048m
  gateway:
    image: kortix/kortix-gateway:0.14.19
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      KORTIX_SECRET_SEED: ${KORTIX_SECRET_SEED}
      API_HOST: api
      PORT: '8090'
      KORTIX_ROLE: gateway
      KORTIX_BOOT: 
    expose:
    - '8090'
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - 'bun -e "fetch(''http://127.0.0.1:8090/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2048m
  frontend:
    image: kortix/kortix-frontend:0.14.19
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - echo "$$KORTIX_BOOT" | base64 -d | gzip -dc > /tmp/kortix-boot.sh && exec sh /tmp/kortix-boot.sh
    environment:
      JWT_SECRET: ${JWT_SECRET}
      API_HOST: api
      KONG_HOST: kong
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      EMAIL_URL: ${EMAIL_URL:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      KORTIX_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      KORTIX_PUBLIC_BACKEND_URL: ${API_PUBLIC_URL}/v1
      KORTIX_PUBLIC_APP_URL: ${PUBLIC_URL}
      KORTIX_PUBLIC_BILLING_ENABLED: 'false'
      KORTIX_PUBLIC_RESTRICT_ACCOUNT_CREATION: 'true'
      KORTIX_PUBLIC_DISABLE_LANDING_PAGE: 'true'
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      BACKEND_URL: ${API_PUBLIC_URL}/v1
      NODE_OPTIONS: --max-http-header-size=131072
      KORTIX_ROLE: frontend
      KORTIX_BOOT: 
    expose:
    - '3000'
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - 'node -e "fetch(''http://127.0.0.1:3000/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
volumes:
  kortix-db-data:
  kortix-storage-data:
