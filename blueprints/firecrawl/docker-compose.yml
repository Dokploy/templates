version: "3.8"

# The database schema and OpenAPI artifact are generated from Firecrawl
# v2.11.230 and embedded as Compose configs so Dokploy can import the entire
# authenticated stack as one template without external files.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  firecrawl-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: firecrawl
    configs:
      - source: db-init-prerequisites
        target: /docker-entrypoint-initdb.d/010-prerequisites.sql
      - source: db-init-schema
        target: /docker-entrypoint-initdb.d/020-current-schema.sql
      - source: db-init-constraints
        target: /docker-entrypoint-initdb.d/030-selfhost-constraints.sql
      - source: db-init-rpcs
        target: /docker-entrypoint-initdb.d/040-selfhost-rpcs.sql
    volumes:
      - firecrawl-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firecrawl"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  firecrawl-db-seed:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: "no"
    depends_on:
      firecrawl-db:
        condition: service_healthy
    environment:
      PGHOST: firecrawl-db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${APP_POSTGRES_PASSWORD:?required}
      PGDATABASE: firecrawl
      FIRECRAWL_ORG_ID: ${FIRECRAWL_ORG_ID:?required}
      FIRECRAWL_TEAM_ID: ${FIRECRAWL_TEAM_ID:?required}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?required}
    configs:
      - source: db-seed
        target: /seed.sql
    command:
      - /bin/sh
      - -ec
      - >-
        psql
        -v org_id="$${FIRECRAWL_ORG_ID}"
        -v team_id="$${FIRECRAWL_TEAM_ID}"
        -v api_key="$${FIRECRAWL_API_KEY}"
        -f /seed.sql
    logging: *default-logging

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NUQ_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --bind 0.0.0.0 --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service@sha256:468009bae00911d40d7120d58489a1d529362c22c45585cb9076094fe61b0025
    restart: unless-stopped
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-true}
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging: *default-logging

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:2.11.230@sha256:7c5bf28dd3397be9a5bfb103adeef9adefbad352d223011da1bab606a0044416
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      ENV: local
      HOST: 0.0.0.0
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      USE_DB_AUTHENTICATION: "true"
      DATABASE_URL: postgresql://postgres:${APP_POSTGRES_PASSWORD:?required}@firecrawl-db:5432/firecrawl
      DATABASE_REPLICA_URL: postgresql://postgres:${APP_POSTGRES_PASSWORD:?required}@firecrawl-db:5432/firecrawl
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
      REDIS_RATE_LIMIT_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_DATABASE_URL: postgresql://postgres:${NUQ_POSTGRES_PASSWORD:?required}@nuq-postgres:5432/postgres
      NUQ_DATABASE_URL_LISTEN: postgresql://postgres:${NUQ_POSTGRES_PASSWORD:?required}@nuq-postgres:5432/postgres
      NUQ_RABBITMQ_URL: amqp://${RABBITMQ_USER:?required}:${RABBITMQ_PASSWORD:?required}@rabbitmq:5672
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NUQ_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: "5432"
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
      HARNESS_STARTUP_TIMEOUT_MS: "120000"
      LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
      DISABLE_ENGPICKER: ${DISABLE_ENGPICKER:-true}
      BULL_AUTH_KEY: ${BULL_AUTH_KEY:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME:-}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY:-}
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES:-}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-}
      SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL:-}
      SELF_HOSTED_WEBHOOK_HMAC_SECRET: ${SELF_HOSTED_WEBHOOK_HMAC_SECRET:-}
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
    expose:
      - "3002"
    depends_on:
      firecrawl-db-seed:
        condition: service_completed_successfully
      nuq-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      playwright-service:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3002/v0/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *default-logging

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.14@sha256:3d93169968848d371a6a56ca1ab18b47a8906ba461b8eba0688866354f5431d5
    restart: unless-stopped
    environment:
      SWAGGER_JSON_URL: /openapi.json
      DEEP_LINKING: "true"
      DISPLAY_OPERATION_ID: "false"
      DISPLAY_REQUEST_DURATION: "true"
      DOC_EXPANSION: none
      PERSIST_AUTHORIZATION: "true"
      TRY_IT_OUT_ENABLED: "true"
    configs:
      - source: firecrawl-openapi
        target: /tmp/openapi.json.gz.b64
    command:
      - /bin/sh
      - -ec
      - >-
        base64 -d /tmp/openapi.json.gz.b64 | gzip -dc > /usr/share/nginx/html/openapi.json;
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    expose:
      - "8080"
    logging: *default-logging

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    configs:
      - source: firecrawl-gateway-nginx
        target: /etc/nginx/conf.d/default.conf
    expose:
      - "8080"
    depends_on:
      firecrawl:
        condition: service_healthy
      swagger-ui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v0/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

configs:
  db-init-prerequisites:
    content: |
      \set ON_ERROR_STOP on

      CREATE SCHEMA IF NOT EXISTS extensions;
      CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;

      CREATE TABLE IF NOT EXISTS public.organizations (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        name text NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now(),
        updated_at timestamptz NOT NULL DEFAULT now()
      );

  db-init-schema:
    # Generated from apps/api/src/db/schema/public.ts at v2.11.230.
    content: |
      CREATE TABLE "agent_sponsors" (
        "id" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name "agent_sponsors_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),
        "email" text NOT NULL,
        "status" text DEFAULT 'pending' NOT NULL,
        "verification_deadline" timestamp with time zone NOT NULL,
        "agent_name" text NOT NULL,
        "sandboxed_team_id" uuid,
        "api_key_id" bigint,
        "requesting_ip" text,
        "tos_version" text,
        "tos_hash" text,
        "verification_token" text NOT NULL,
        "created_at" timestamp with time zone DEFAULT now(),
        "verified_at" timestamp with time zone,
        "updated_at" timestamp with time zone DEFAULT now()
      );
      --> statement-breakpoint
      CREATE TABLE "agents" (
        "id" uuid NOT NULL,
        "request_id" uuid NOT NULL,
        "team_id" uuid NOT NULL,
        "options" jsonb,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "time_taken" numeric NOT NULL,
        "credits_cost" integer NOT NULL,
        "cost_tracking" jsonb,
        "is_successful" boolean NOT NULL,
        "error" text
      );
      --> statement-breakpoint
      CREATE TABLE "api_keys" (
        "id" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name "api_keys_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),
        "created_at" timestamp with time zone DEFAULT now(),
        "key" uuid DEFAULT gen_random_uuid(),
        "name" text,
        "team_id" uuid,
        "owner_id" uuid,
        "agent_provisioned" boolean DEFAULT false,
        "concurrency" integer,
        CONSTRAINT "api_keys_id_team_id_key" UNIQUE("id","team_id")
      );
      --> statement-breakpoint
      CREATE TABLE "batch_scrapes" (
        "id" uuid NOT NULL,
        "request_id" uuid NOT NULL,
        "team_id" uuid NOT NULL,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "num_docs" integer NOT NULL,
        "credits_cost" integer NOT NULL,
        "cancelled" boolean NOT NULL
      );
      --> statement-breakpoint
      CREATE TABLE "blocklist" (
        "id" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name "blocklist_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),
        "data" jsonb NOT NULL,
        "org_id" uuid
      );
      --> statement-breakpoint
      CREATE TABLE "blocklist_hits" (
        "id" uuid NOT NULL,
        "domain" text NOT NULL,
        "url" text,
        "team_id" uuid,
        "origin" text,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL
      );
      --> statement-breakpoint
      CREATE TABLE "browser_session_activities" (
        "id" bigint GENERATED ALWAYS AS IDENTITY (sequence name "browser_session_activities_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),
        "team_id" text NOT NULL,
        "session_id" text NOT NULL,
        "language" text NOT NULL,
        "timeout" integer NOT NULL,
        "exit_code" integer,
        "killed" boolean DEFAULT false NOT NULL,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "source" text DEFAULT 'browser'
      );
      --> statement-breakpoint
      CREATE TABLE "browser_sessions" (
        "id" uuid NOT NULL,
        "team_id" text NOT NULL,
        "request_id" uuid,
        "should_bill" boolean DEFAULT true NOT NULL,
        "browser_id" text NOT NULL,
        "workspace_id" text NOT NULL,
        "context_id" text NOT NULL,
        "cdp_url" text NOT NULL,
        "cdp_path" text NOT NULL,
        "stream_web_view" boolean DEFAULT false NOT NULL,
        "status" text DEFAULT 'active' NOT NULL,
        "ttl_total" integer NOT NULL,
        "ttl_without_activity" integer,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "updated_at" timestamp with time zone DEFAULT now() NOT NULL,
        "deleted_at" timestamp with time zone,
        "credits_used" integer,
        "cdp_interactive_path" text,
        "scrape_id" uuid
      );
      --> statement-breakpoint
      CREATE TABLE "code_searches" (
        "id" uuid NOT NULL,
        "request_id" uuid NOT NULL,
        "target" text NOT NULL,
        "team_id" uuid NOT NULL,
        "options" jsonb,
        "response" jsonb,
        "num_results" integer NOT NULL,
        "time_taken" numeric NOT NULL,
        "credits_cost" integer NOT NULL,
        "is_successful" boolean NOT NULL,
        "error" text,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL
      );
      --> statement-breakpoint
      CREATE TABLE "crawls" (
        "id" uuid NOT NULL,
        "request_id" uuid NOT NULL,
        "url" text NOT NULL,
        "team_id" uuid NOT NULL,
        "options" jsonb,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "num_docs" integer NOT NULL,
        "credits_cost" integer NOT NULL,
        "cancelled" boolean NOT NULL,
        "monitor_id" uuid,
        "monitor_check_id" uuid
      );
      --> statement-breakpoint
      CREATE TABLE "deep_researches" (
        "id" uuid NOT NULL,
        "request_id" uuid NOT NULL,
