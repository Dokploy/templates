[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
auth_secret = "${password:64}"

[config]
# Use https:// in BASE_URL once the domain has HTTPS. Sign-in only works from this URL.
env = [
  "BASE_URL=http://${main_domain}",
  "BETTER_AUTH_SECRET=${auth_secret}",
  "POSTGRES_PASSWORD=${postgres_password}",
]
mounts = []

[[config.domains]]
serviceName = "excaliself"
port = 3000
host = "${main_domain}"
