# SilentSuite for Dokploy. Generated by scripts/dokploy-template-render.py in the
# silent-suite/silentsuite repository from its Umbrel package files; edit those, then regenerate.
#
# Before the first signup, open Domains, switch the domain to HTTPS (your own domain or the
# generated one, with Let's Encrypt) and redeploy. The installation password the owner enters
# at signup is SILENTSUITE_INSTALLATION_PASSWORD in the Environment tab.

[variables]
main_domain = "${domain}"
installation_password = "${hash:32}"
registration_signing = "${hash:64}"
db_password = "${hash:64}"

[config]
env = [
  "SILENTSUITE_INSTALLATION_PASSWORD=${installation_password}",
  "SILENTSUITE_REGISTRATION_SIGNING=${registration_signing}",
  "SILENTSUITE_DB_PASSWORD=${db_password}",
]

[[config.domains]]
serviceName = "silentsuite"
port = 8080
host = "${main_domain}"

[[config.mounts]]
filePath = "/silentsuite/router.conf"
content = '''
# SilentSuite app router: one origin for the web app and the Etebase server.
# Keeps the external Host (including port), binary bodies, POST trailing slashes
# and websocket upgrades. Adds no authorization or registration headers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    access_log off;
    # HTTP error records append the request line; nginx cannot redact it here.
    # Discard request-specific errors, including proxy failures. Master/startup
    # diagnostics retain the image's main error logger.
    error_log /dev/null;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://silentsuite-server:3735;
    }

    location / {
        proxy_pass http://silentsuite-web:3000;
    }
}
'''

[[config.mounts]]
filePath = "/silentsuite/init.sh"
content = '''
#!/bin/sh
# One-shot preparation of SilentSuite's own bind-mounted directories.
# Runs as root in the server image only to give that image's user ownership of /data
# and /config, and to write the private server configuration. It touches nothing else.
set -eu

case "${DATABASE_PASSWORD:-}" in
  '' | *[!0-9a-f]*)
    echo "[init] database password is missing or not lowercase hex" >&2
    exit 1
    ;;
esac

uid="$(id -u etebase)"
gid="$(id -g etebase)"

mkdir -p /data/media /data/static
chown "$uid:$gid" /data /data/media /data/static
chmod 700 /data
if [ -f /data/secret.txt ]; then
  chown "$uid:$gid" /data/secret.txt
  chmod 600 /data/secret.txt
fi

umask 077
tmp=/config/.etebase-server.ini.tmp
cat > "$tmp" <<EOF
[global]
secret_file = /data/secret.txt
debug = false
static_root = /data/static
media_root = /data/media

[allowed_hosts]
allowed_host1 = *

[database]
engine = django.db.backends.postgresql
name = silentsuite
user = silentsuite
password = ${DATABASE_PASSWORD}
host = silentsuite-postgres
port = 5432
EOF
chown "$uid:$gid" "$tmp"
chmod 600 "$tmp"
mv "$tmp" /config/etebase-server.ini
chown "$uid:$gid" /config
chmod 700 /config
echo "[init] server directories prepared"
'''

[[config.mounts]]
filePath = "/silentsuite/server-start.sh"
content = '''
#!/bin/sh
# SilentSuite Umbrel package startup wrapper.
#
# Runs the same server lifecycle as the shared image entrypoint — collectstatic,
# database migrations, then uvicorn with two workers — with two package-runtime
# guarantees the image entrypoint does not provide:
#   1. HTTP access logging and WebSocket connection INFO records are disabled.
#      Explicit startup messages and Uvicorn warnings/errors remain available.
#   2. umask 077, so files the server creates under /data start private and the
#      first-boot secret is never group/world-readable, even briefly.
#
# No Django superuser step exists here: the package never configures one.
set -eu

umask 077
cd /app

# Parity with the image entrypoint: explicit arguments run directly.
if [ "$#" -gt 0 ]; then
  exec "$@"
fi

echo "[package-start] collecting static assets..."
python manage.py collectstatic --noinput --verbosity 0

echo "[package-start] applying database migrations..."
python manage.py migrate --noinput

echo "[package-start] starting uvicorn (access and connection logs disabled)..."
TRUSTED_PROXY_IPS="${TRUSTED_PROXY_IPS:-127.0.0.1}"
exec uvicorn etebase_server.asgi:application \
    --host 0.0.0.0 --port 3735 \
    --workers 2 --proxy-headers --no-access-log --log-level warning \
    --forwarded-allow-ips "$TRUSTED_PROXY_IPS"
'''
