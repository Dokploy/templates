      - "/run/harbor-config/launch.sh"
    "command": []
    "volumes":
      -
        "type": "volume"
        "source": "config"
        "target": "/run/harbor-config"
        "read_only": true
        "volume":
          "nocopy": true
          "subpath": "exporter"
      -
        "type": "volume"
        "source": "control"
        "target": "/run/harbor-control"
        "read_only": true
        "volume":
          "nocopy": true
      -
        "type": "volume"
        "source": "config"
        "target": "/harbor_cust_cert"
        "read_only": true
        "volume":
          "nocopy": true
          "subpath": "shared/trust-certificates"
    "depends_on":
      "harbor-init":
        "condition": "service_completed_successfully"
      "core":
        "condition": "service_healthy"
      "postgresql":
        "condition": "service_healthy"
      "redis":
        "condition": "service_healthy"
    "cap_drop":
      - "ALL"
    "cap_add":
      - "CHOWN"
      - "SETGID"
      - "SETUID"
    "security_opt":
      - "no-new-privileges:true"
    "mem_limit": "${EXPORTER_MEMORY_LIMIT:-128m}"
    "cpus": "${EXPORTER_CPU_LIMIT:-1.0}"
    "stop_grace_period": "120s"
    "healthcheck":
      "interval": "15s"
      "timeout": "10s"
      "retries": 10
      "start_period": "60s"
