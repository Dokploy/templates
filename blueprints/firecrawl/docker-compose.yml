        "url" text NOT NULL,
        "url_hash" bytea NOT NULL,
        "status" text NOT NULL,
        "previous_scrape_id" uuid,
        "current_scrape_id" uuid,
        "diff_gcs_key" text,
        "diff_text_bytes" integer,
        "diff_json_bytes" integer,
