  db-init-constraints:
    content: |
      \set ON_ERROR_STOP on

      -- The public Drizzle schema mirrors Firecrawl's managed database shape, where
      -- several constraints are applied out-of-band. Recreate those constraints for
      -- a standalone PostgreSQL database.
      DO $$firecrawl$$
      DECLARE
        table_record record;
      BEGIN
        FOR table_record IN
          SELECT c.table_name
          FROM information_schema.columns c
          JOIN information_schema.tables t
            ON t.table_schema = c.table_schema
           AND t.table_name = c.table_name
          WHERE c.table_schema = 'public'
            AND c.column_name = 'id'
            AND c.is_nullable = 'NO'
            AND t.table_type = 'BASE TABLE'
            AND NOT EXISTS (
              SELECT 1
              FROM pg_constraint pc
              JOIN pg_class rel ON rel.oid = pc.conrelid
              JOIN pg_namespace ns ON ns.oid = rel.relnamespace
              WHERE ns.nspname = 'public'
                AND rel.relname = c.table_name
                AND pc.contype = 'p'
            )
        LOOP
          EXECUTE format(
            'ALTER TABLE public.%I ADD CONSTRAINT %I PRIMARY KEY (id)',
            table_record.table_name,
            table_record.table_name || '_pkey'
          );
        END LOOP;
      END
      $$firecrawl$$;

      CREATE UNIQUE INDEX IF NOT EXISTS api_keys_key_unique
        ON public.api_keys (key);
      CREATE UNIQUE INDEX IF NOT EXISTS idempotency_keys_key_unique
        ON public.idempotency_keys (key);
      CREATE UNIQUE INDEX IF NOT EXISTS slack_installations_team_id_unique
        ON public.slack_installations (team_id);
      CREATE UNIQUE INDEX IF NOT EXISTS monitor_pages_identity_unique
        ON public.monitor_pages (monitor_id, target_id, url_hash);
      CREATE UNIQUE INDEX IF NOT EXISTS monitor_email_recipients_identity_unique
        ON public.monitor_email_recipients (monitor_id, email);

      CREATE INDEX IF NOT EXISTS api_keys_team_id_idx ON public.api_keys (team_id);
      CREATE INDEX IF NOT EXISTS requests_team_id_idx ON public.requests (team_id);
      CREATE INDEX IF NOT EXISTS requests_dr_clean_by_idx
        ON public.requests (dr_clean_by)
        WHERE dr_clean_by IS NOT NULL;
      CREATE INDEX IF NOT EXISTS monitors_due_idx
        ON public.monitors (next_run_at)
        WHERE status = 'active' AND deleted_at IS NULL;

  db-init-rpcs:
    # Standalone implementations for database RPCs called by v2.11.230.
    content: |
      \set ON_ERROR_STOP on

      -- Firecrawl's current API calls these PostgreSQL functions directly. They are
      -- not included in the public self-host guide, so this file supplies standalone
      -- equivalents. Billing is intentionally unlimited for this private self-host.

      CREATE OR REPLACE FUNCTION public.selfhost_unlimited_rate_limit_flags()
      RETURNS jsonb
      LANGUAGE sql
      IMMUTABLE
      AS $$function$$
        SELECT jsonb_build_object(
          'rateLimitOverrides',
          jsonb_build_object(
            'crawl', 2147483647,
            'crawlStatus', 2147483647,
            'scrape', 2147483647,
            'scrapeAgentPreview', 2147483647,
            'preview', 2147483647,
            'search', 2147483647,
            'map', 2147483647,
            'extract', 2147483647,
            'extractStatus', 2147483647,
            'extractAgentPreview', 2147483647,
            'browser', 2147483647,
            'browserExecute', 2147483647,
            'browserReplay', 2147483647,
            'account', 2147483647,
            'supportAsk', 2147483647,
            'supportDocsSearch', 2147483647,
            'research', 2147483647,
            'developerSearch', 2147483647,
            'labs', 2147483647
          )
        )
      $$function$$;

      CREATE TABLE IF NOT EXISTS public.firecrawl_change_tracking_scrapes (
        id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        team_id uuid NOT NULL,
        url text NOT NULL,
        job_id text NOT NULL,
        change_tracking_tag text,
        date_added timestamptz NOT NULL DEFAULT now()
      );

      CREATE INDEX IF NOT EXISTS firecrawl_change_tracking_lookup_idx
        ON public.firecrawl_change_tracking_scrapes
          (team_id, url, change_tracking_tag, date_added DESC);

      CREATE OR REPLACE FUNCTION public.auth_chunk_1(
        input_key text,
        input_credential_purpose text DEFAULT 'general'
      )
      RETURNS TABLE (
        api_key text,
        api_key_id bigint,
        team_id uuid,
        org_id uuid,
        flags jsonb,
        is_banned boolean
      )
      LANGUAGE sql
      STABLE
      SECURITY DEFINER
      SET search_path = public, pg_temp
      AS $$function$$
        SELECT
          k.key::text,
          k.id,
          t.id,
          t.org_id,
          public.selfhost_unlimited_rate_limit_flags(),
          COALESCE(t.banned, false)
        FROM public.api_keys k
        JOIN public.teams t ON t.id = k.team_id
        WHERE k.key::text = input_key
        LIMIT 1
      $$function$$;

      CREATE OR REPLACE FUNCTION public.auth_chunk_1_from_team(input_team text)
      RETURNS TABLE (
        api_key text,
        api_key_id bigint,
        team_id uuid,
        org_id uuid,
        flags jsonb,
        is_banned boolean
      )
      LANGUAGE sql
      STABLE
      SECURITY DEFINER
      SET search_path = public, pg_temp
      AS $$function$$
        SELECT
          k.key::text,
          k.id,
          t.id,
          t.org_id,
          public.selfhost_unlimited_rate_limit_flags(),
          COALESCE(t.banned, false)
        FROM public.teams t
        LEFT JOIN LATERAL (
          SELECT ak.id, ak.key
          FROM public.api_keys ak
          WHERE ak.team_id = t.id
          ORDER BY ak.id
          LIMIT 1
        ) k ON true
        WHERE t.id = input_team::uuid
        LIMIT 1
      $$function$$;

      CREATE OR REPLACE FUNCTION public.bill_team_7(
        _team_id uuid,
        sub_id text,
        credits numeric,
        i_api_key_id bigint,
        is_extract_param boolean
      )
      RETURNS TABLE (api_key text)
      LANGUAGE sql
      VOLATILE
      SECURITY DEFINER
      SET search_path = public, pg_temp
      AS $$function$$
        SELECT k.key::text
        FROM public.api_keys k
        WHERE k.team_id = _team_id
          AND (i_api_key_id IS NULL OR k.id = i_api_key_id)
        ORDER BY k.id
        LIMIT 1
      $$function$$;

      CREATE OR REPLACE FUNCTION public.credits_billed_by_crawl_id_2(i_crawl_id uuid)
      RETURNS TABLE (credits_billed bigint)
      LANGUAGE sql
      STABLE
      SET search_path = public, pg_temp
      AS $$function$$
        SELECT COALESCE((
          SELECT c.credits_cost::bigint
          FROM public.crawls c
          WHERE c.id = i_crawl_id
          LIMIT 1
        ), 0::bigint)
      $$function$$;

      CREATE OR REPLACE FUNCTION public.change_tracking_insert_scrape(
        p_team_id uuid,
        p_url text,
        p_job_id text,
        p_change_tracking_tag text,
        p_date_added timestamptz
      )
      RETURNS bigint
      LANGUAGE plpgsql
      VOLATILE
      SET search_path = public, pg_temp
      AS $$function$$
      DECLARE
        inserted_id bigint;
      BEGIN
        INSERT INTO public.firecrawl_change_tracking_scrapes (
          team_id, url, job_id, change_tracking_tag, date_added
        ) VALUES (
          p_team_id, p_url, p_job_id, p_change_tracking_tag, p_date_added
        )
        RETURNING id INTO inserted_id;
        RETURN inserted_id;
      END
      $$function$$;

      CREATE OR REPLACE FUNCTION public.diff_get_last_scrape_v7(
        i_team_id uuid,
        i_url text,
        i_tag text
      )
      RETURNS TABLE (o_job_id text, o_date_added timestamptz)
      LANGUAGE sql
      STABLE
      SET search_path = public, pg_temp
      AS $$function$$
        SELECT ct.job_id, ct.date_added
        FROM public.firecrawl_change_tracking_scrapes ct
        WHERE ct.team_id = i_team_id
          AND ct.url = i_url
          AND ct.change_tracking_tag IS NOT DISTINCT FROM i_tag
        ORDER BY ct.date_added DESC
        LIMIT 1
      $$function$$;

      CREATE OR REPLACE FUNCTION public.get_zdr_cleanup_batch_2(p_limit integer)
      RETURNS TABLE (request_id uuid, ids uuid[])
      LANGUAGE sql
      STABLE
      SET search_path = public, pg_temp
      AS $$function$$
        SELECT NULL::uuid, ARRAY[]::uuid[]
        WHERE false
      $$function$$;

      CREATE OR REPLACE FUNCTION public.monitoring_claim_due_monitors(
        p_worker_id text,
        p_limit integer,
        p_lease_seconds integer
      )
      RETURNS SETOF public.monitors
      LANGUAGE plpgsql
      VOLATILE
      SET search_path = public, pg_temp
      AS $$function$$
      BEGIN
        RETURN QUERY
        WITH due AS (
          SELECT m.id
          FROM public.monitors m
          WHERE m.status = 'active'
            AND m.deleted_at IS NULL
            AND m.next_run_at IS NOT NULL
            AND m.next_run_at <= now()
            AND (m.locked_until IS NULL OR m.locked_until < now())
          ORDER BY m.next_run_at
          FOR UPDATE SKIP LOCKED
          LIMIT GREATEST(p_limit, 0)
        )
        UPDATE public.monitors m
        SET locked_at = now(),
            locked_until = now() + make_interval(secs => GREATEST(p_lease_seconds, 1)),
            updated_at = now()
        FROM due
        WHERE m.id = due.id
        RETURNING m.*;
      END
      $$function$$;

      CREATE OR REPLACE FUNCTION public.get_agent_free_requests_left(i_team_id uuid)
      RETURNS TABLE (free_requests_left integer)
      LANGUAGE sql
      STABLE
      AS $$function$$
        SELECT 2147483647
      $$function$$;

      CREATE OR REPLACE FUNCTION public.agent_consume_free_request_if_left(i_team_id uuid)
      RETURNS TABLE (consumed boolean)
      LANGUAGE sql
      VOLATILE
      AS $$function$$
        SELECT true
      $$function$$;

  db-seed:
    content: |
      \set ON_ERROR_STOP on

      INSERT INTO public.organizations (id, name)
      VALUES (:'org_id'::uuid, 'Self-hosted')
      ON CONFLICT (id) DO UPDATE SET updated_at = now();

      INSERT INTO public.teams (id, name, org_id, banned)
      VALUES (:'team_id'::uuid, 'Self-hosted', :'org_id'::uuid, false)
      ON CONFLICT (id) DO UPDATE
      SET org_id = EXCLUDED.org_id,
          banned = false,
          updated_at = now();

      INSERT INTO public.api_keys (key, name, team_id)
      VALUES (regexp_replace(:'api_key', '^fc-', '')::uuid, 'Dokploy production', :'team_id'::uuid)
      ON CONFLICT (key) DO UPDATE
      SET team_id = EXCLUDED.team_id,
          name = EXCLUDED.name;

      -- Workers require one global row even when the self-host blocklist is empty.
      INSERT INTO public.blocklist (data, org_id)
      SELECT '{"blocklist":[],"allowedKeywords":[]}'::jsonb, NULL
      WHERE NOT EXISTS (
        SELECT 1 FROM public.blocklist WHERE org_id IS NULL
      );

  firecrawl-openapi:
    content: |
      

  firecrawl-gateway-nginx:
    content: |
      server {
        listen 8080;
        server_name _;
        client_max_body_size 50m;

        location = /openapi.json {
          proxy_pass http://swagger-ui:8080/openapi.json;
          proxy_set_header Host $$host;
          add_header Cache-Control "no-store" always;
        }

        location = /docs {
          return 308 /docs/;
        }

        location /docs/ {
          proxy_pass http://swagger-ui:8080/;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Forwarded-Prefix /docs;
        }

        location / {
          proxy_pass http://firecrawl:3002;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        '' close;
      }



