[variables]
main_domain = "${domain}"
machine_id = "${randomPort}"
app_secret = "${base64:48}"
admin_email = "${email}"
admin_password = "${password:32}"
headroom_proxy_token = "${base64:32}"

[config]
env = [
  "TERA_HOST=${main_domain}",
  "MACHINE_ID=${machine_id}",
  "APP_SECRET=${app_secret}",
  "ADMIN_EMAIL=${admin_email}",
  "ADMIN_PASSWORD=${admin_password}",
  "TRUSTED_PROXIES=10.0.1.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32",
  "SENTRY_DSN=",
  "HEADROOM_PROXY_TOKEN=${headroom_proxy_token}",
  "OIDC_ISSUER=",
  "OIDC_CLIENT_ID=",
  "OIDC_CLIENT_SECRET=",
  "OIDC_PROVIDER_NAME=",
  "OIDC_REDIRECT_URL=",
]
mounts = []

[[config.domains]]
serviceName = "terarouter"
port = 8080
host = "${main_domain}"
