services:
  planka:
    image: ghcr.io/plankanban/planka:2.3.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # BASE_URL must match the public address exactly, or login breaks.
      - BASE_URL=https://${main_domain}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/planka
      # Signs every access token. Dokploy generates it at deploy time (see
      # template.toml); never change it afterwards or all sessions break.
      - SECRET_KEY=${SECRET_KEY}
      # Dokploy serves the app through its reverse proxy.
      - TRUST_PROXY=true
      # Planka creates no admin account by itself (since 1.13), so the first
      # administrator is seeded from these variables. Its password is
      # generated by Dokploy; find it under this app's Environment tab.
      # While these variables stay set, Planka re-applies the password on
      # every start and the account cannot be edited or deleted in the UI —
      # remove them after the first login to make it a normal account
      # (see README).
      - DEFAULT_ADMIN_EMAIL=admin@planka.local
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=Admin
      - DEFAULT_ADMIN_USERNAME=admin
    volumes:
      # Uploads, attachments, avatars and background images.
      - planka_data:/app/data
    expose:
      - "1337"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  planka_data:
  pgdata:
