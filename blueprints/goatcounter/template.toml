[variables]
# Dynamic variables generated by Dokploy upon deployment
goatcounter_email = "${email}"
goatcounter_password = "${password:24}"
db_password = "${password:32}"
goatcounter_domain = "${domain}"

[env]
# Map generated variables to container environment variables
GOATCOUNTER_EMAIL = "${goatcounter_email}"
GOATCOUNTER_PASSWORD = "${goatcounter_password}"
DB_PASSWORD = "${db_password}"

[domains]
# Automatically configures Traefik reverse proxy in Dokploy
[domains.goatcounter]
service_name = "goatcounter"
port = 8080
host = "${goatcounter_domain}"
https = true