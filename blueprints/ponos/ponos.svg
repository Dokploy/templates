      </g>
      <path data-layer="tear" class="tear" d="M88 60 C85.6 64 85.6 66.6 88 66.6 C90.4 66.6 90.4 64 88 60 Z"/>
    </g>
    <g data-layer="arm-left">
      <path class="limb" d="M45 89 L38.5 96"/>
