services:
  libredb-studio:
    image: ghcr.io/libredb/libredb-studio:0.18.2
    restart: unless-stopped
    environment:
      # Since 0.18.0 ADMIN_PASSWORD and USER_PASSWORD seed the account table only
      # while it is empty; editing them afterwards is logged and ignored. The app
      # tells the operator to set ADMIN_PASSWORD_RESET=true for one start, so it is
      # passed through here: this environment list is an allowlist, and without the
      # line the variable never reaches the container and the advice cannot be
      # followed from Dokploy's Environment panel. Empty is falsy, so it is inert
      # until someone sets it, and it must be removed again afterwards because every
      # start applies it while it is set. There is no USER equivalent; that account
      # is changed from Studio's own Accounts screen.
      - ADMIN_PASSWORD_RESET=${ADMIN_PASSWORD_RESET:-}
      - ADMIN_EMAIL=admin@libredb.org
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - USER_EMAIL=user@libredb.org
      - USER_PASSWORD=${USER_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PROVIDER=sqlite
      - STORAGE_SQLITE_PATH=/app/data/libredb-storage.db
      # Dokploy's auto-generated domain is HTTP (sslip.io); keep false so login works
      - AUTH_COOKIE_SECURE=false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/db/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - libredb-data:/app/data
volumes:
  libredb-data:
