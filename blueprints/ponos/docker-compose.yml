services:
  ponos:
    image: ghcr.io/hermez-agency/ponos:0.2.0
    restart: unless-stopped
    # The image's own user, said again so that nothing runs it as root: Claude
    # Code refuses bypassPermissions to root.
    user: ponos
    expose:
      - "8787"
    environment:
      PONOS_WEB_EMAIL: ${PONOS_WEB_EMAIL}
      PONOS_WEB_PASSWORD: ${PONOS_WEB_PASSWORD}
      PONOS_WEB_TOKEN: ${PONOS_WEB_TOKEN}
      PONOS_LANGUAGE: ${PONOS_LANGUAGE}
      TZ: ${TZ}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GH_TOKEN: ${GH_TOKEN}
      PONOS_NOTION_TOKEN: ${PONOS_NOTION_TOKEN}
      PONOS_TELEGRAM_TOKEN: ${PONOS_TELEGRAM_TOKEN}
      PONOS_SLACK_TOKEN: ${PONOS_SLACK_TOKEN}
    volumes:
      - ponos-data:/data
      - ponos-workspace:/workspace
      - ponos-claude:/home/ponos/.claude
      - ponos-gh:/home/ponos/.config/gh
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # A ceiling, not a reservation: a Claude Code session is a Node process of
    # a few hundred megabytes, and a build or a test suite it runs adds its own.
    # Four gigabytes hold the two runner.max_concurrent allows by default; raise
    # it with that number.
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  ponos-data:
  ponos-workspace:
  ponos-claude:
  ponos-gh:
