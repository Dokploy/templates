version: "3.8"
services:
  hyperdx:
    image: hyperdx/hyperdx:2.38.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      FRONTEND_URL: ${HYPERDX_URL:?Set the public HyperDX URL}
      HYPERDX_APP_URL: ${HYPERDX_URL:?Set the public HyperDX URL}
      HYPERDX_APP_PORT: "8080"
      HYPERDX_API_PORT: "8000"
      SERVER_URL: http://127.0.0.1:8000
      OPAMP_PORT: "4320"
      MONGO_URI: mongodb://mongodb:27017/hyperdx
      EXPRESS_SESSION_SECRET: ${SESSION_SECRET:?Set the session secret}
      HYPERDX_LOG_LEVEL: info
      USAGE_STATS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      DEFAULT_CONNECTIONS: '[{"name":"Local
        ClickHouse","host":"http://clickhouse:8123","username":"hyperdx","password":"${CLICKHOUSE_PASSWORD}"}]'
      DEFAULT_SOURCES: '[{"from":{"databaseName":"default","tableName":"otel_logs"},"kind":"log","timestampValueExpression":"Timestamp","name":"Logs","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","metadataMaterializedViews":{"keyRollupTable":"otel_logs_key_rollup_15m","kvRollupTable":"otel_logs_kv_rollup_15m","granularity":"15
        minute"},"connection":"Local
        ClickHouse","traceSourceId":"Traces","sessionSourceId":"Sessions","metricSourceId":"Metrics"},{"from":{"databaseName":"default","tableName":"otel_traces"},"kind":"trace","timestampValueExpression":"Timestamp","name":"Traces","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"SpanName","serviceNameExpression":"ServiceName","eventAttributesExpression":"SpanAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName","traceIdExpression":"TraceId","spanIdExpression":"SpanId","durationExpression":"Duration","durationPrecision":9,"parentSpanIdExpression":"ParentSpanId","spanNameExpression":"SpanName","spanKindExpression":"SpanKind","statusCodeExpression":"StatusCode","statusMessageExpression":"StatusMessage","metadataMaterializedViews":{"keyRollupTable":"otel_traces_key_rollup_15m","kvRollupTable":"otel_traces_kv_rollup_15m","granularity":"15
        minute"},"connection":"Local
        ClickHouse","logSourceId":"Logs","sessionSourceId":"Sessions","metricSourceId":"Metrics"},{"from":{"databaseName":"default","tableName":""},"kind":"metric","timestampValueExpression":"TimeUnix","name":"Metrics","resourceAttributesExpression":"ResourceAttributes","metricTables":{"gauge":"otel_metrics_gauge","histogram":"otel_metrics_histogram","sum":"otel_metrics_sum","exponential histogram":"otel_metrics_exponential_histogram","_id":"682586a8b1f81924e628e808","id":"682586a8b1f81924e628e808"},"connection":"Local
        ClickHouse","logSourceId":"Logs","traceSourceId":"Traces","sessionSourceId":"Sessions"},{"from":{"databaseName":"default","tableName":"hyperdx_sessions"},"kind":"session","timestampValueExpression":"TimestampTime","name":"Sessions","displayedTimestampValueExpression":"Timestamp","implicitColumnExpression":"Body","serviceNameExpression":"ServiceName","bodyExpression":"Body","eventAttributesExpression":"LogAttributes","resourceAttributesExpression":"ResourceAttributes","defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body","severityTextExpression":"SeverityText","traceIdExpression":"TraceId","spanIdExpression":"SpanId","connection":"Local
        ClickHouse","logSourceId":"Logs","traceSourceId":"Traces","metricSourceId":"Metrics"}]'
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:8080/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  mongodb:
    image: mongo:8.0.29
    restart: unless-stopped
    command:
      - mongod
      - --wiredTigerCacheSizeGB
      - "0.25"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  clickhouse:
    image: clickhouse/clickhouse-server:26.5.7.64-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: hyperdx
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set the ClickHouse password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ../files/clickhouse-config.xml:/etc/clickhouse-server/config.d/hyperdx.xml:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8123/ping
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  otel-collector:
    image: clickhouse/clickstack-otel-collector:2.38.0
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      hyperdx:
        condition: service_healthy
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000?dial_timeout=10s
      CLICKHOUSE_USER: hyperdx
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set the ClickHouse password}
      HYPERDX_OTEL_EXPORTER_CLICKHOUSE_DATABASE: default
      HYPERDX_OTEL_EXPORTER_CREATE_LEGACY_SCHEMA: "true"
      OPAMP_SERVER_URL: http://hyperdx:4320
      HYPERDX_LOG_LEVEL: info
    expose:
      - "4317"
      - "4318"
    volumes:
      - otel-supervisor:/etc/otel/supervisor-data
volumes:
  mongodb-data: {}
  mongodb-config: {}
  clickhouse-data: {}
  clickhouse-logs: {}
  otel-supervisor: {}
