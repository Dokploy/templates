services:
  allswap-validator:
    image: node:22-alpine
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL}
    command:
      - sh
      - -c
      - |
        npm install --no-save fastify-multichain-address && node -e "
        const http = require('http');
        const { validateCryptoAddress } = require('fastify-multichain-address');
        http.createServer((req, res) => {
          if (req.url === '/health') { res.writeHead(200, {'Content-Type':'application/json'}); return res.end('{\"ok\":true}'); }
          if (req.method === 'POST' && req.url === '/validate') {
            let body = ''; req.on('data', c => body += c);
            req.on('end', () => {
              try {
                const { chain, address, memo, trustedAddress } = JSON.parse(body || '{}');
                const result = validateCryptoAddress(chain, address, memo, trustedAddress);
                res.writeHead(result.valid ? 200 : 400, {'Content-Type':'application/json'});
                res.end(JSON.stringify(result));
              } catch (e) { res.writeHead(400); res.end('{\"error\":\"Invalid JSON\"}'); }
            });
            return;
          }
          res.writeHead(200, {'Content-Type':'application/json'});
          res.end(JSON.stringify({ service: 'AllSwap MultiChain Address & Memo Validator API', docs: 'https://allswap.io/tools/address-validator' }));
        }).listen(3000);
        "
