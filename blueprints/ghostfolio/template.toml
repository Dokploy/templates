[variables]
main_domain = "${domain}"
db_password = "${password:24}"
access_token_salt = "${base64:32}"
jwt_secret_key = "${base64:32}"

[config]
mounts = []
[[config.domains]]
serviceName = "ghostfolio"
port = 3333
host = "${main_domain}"

[config.env]
DB_PASSWORD = "${db_password}"
ACCESS_TOKEN_SALT = "${access_token_salt}"
JWT_SECRET_KEY = "${jwt_secret_key}"
