<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" data-state="idle" data-theme="auto" role="img">
<title>Ponos</title>
<style>
svg { --robot-body: #78a0ff; --robot-body-shade: #5079e6; --robot-screen: #1c2547; --robot-eye: #b4f1ff; --robot-accent: #ffcf5c; --robot-flame: #f59a3c; --robot-flame-core: #fbd35a; --robot-gold: #f2c65a; --robot-gold-deep: #b8861f; --robot-tunic: #f3ecdc; --robot-sash: #c4553a; --robot-pink: #ff8fb0; --robot-glint: #ffffff; --robot-alert: #ff6b86; --robot-ink: #46599a; --robot-shadow: rgba(36, 52, 110, .16); }
svg[data-theme="dark"] { --robot-body: #82a8ff; --robot-body-shade: #5c84ee; --robot-screen: #141b36; --robot-eye: #b4f1ff; --robot-accent: #ffd36b; --robot-flame: #f59a3c; --robot-flame-core: #fbd35a; --robot-gold: #f2c65a; --robot-gold-deep: #b8861f; --robot-tunic: #f3ecdc; --robot-sash: #c4553a; --robot-pink: #ff8fb0; --robot-glint: #ffffff; --robot-alert: #ff7d93; --robot-ink: #a9bdf2; --robot-shadow: rgba(130, 168, 255, .16); }
@media (prefers-color-scheme: dark) { svg:not([data-theme="light"]) { --robot-body: #82a8ff; --robot-body-shade: #5c84ee; --robot-screen: #141b36; --robot-eye: #b4f1ff; --robot-accent: #ffd36b; --robot-flame: #f59a3c; --robot-flame-core: #fbd35a; --robot-gold: #f2c65a; --robot-gold-deep: #b8861f; --robot-tunic: #f3ecdc; --robot-sash: #c4553a; --robot-pink: #ff8fb0; --robot-glint: #ffffff; --robot-alert: #ff7d93; --robot-ink: #a9bdf2; --robot-shadow: rgba(130, 168, 255, .16); } }
svg { display: block; width: 100%; height: auto; overflow: visible; }
[data-layer] { transform-box: view-box; }
[data-layer="frame"] { transform-origin: 64px 44px; }
[data-layer="base"] { transform-origin: 64px 119px; }
[data-layer="rig"] { transform-origin: 64px 119px; }
[data-layer="head"] { transform-origin: 64px 86px; }
[data-layer="flame"] { transform-origin: 64px 22px; }
[data-layer="fire"] { transform-origin: 64px 21px; }
[data-layer="arm-left"] { transform-origin: 45px 89px; }
[data-layer="arm-right"] { transform-origin: 83px 89px; }
[data-layer="forearm-left"] { transform-origin: 38.5px 96px; }
[data-layer="forearm-right"] { transform-origin: 89.5px 96px; }
[data-layer="leg-left"] { transform-origin: 54px 104px; }
[data-layer="leg-right"] { transform-origin: 74px 104px; }
[data-layer="lid-left"] { transform-origin: 50px 42px; }
[data-layer="lid-right"] { transform-origin: 78px 42px; }
[data-layer="mouth"] { transform-origin: 64px 68px; }
[data-layer="tear"] { transform-origin: 88px 60px; }
[data-layer="z1"] { transform-origin: 97px 23px; }
[data-layer="z2"] { transform-origin: 106px 13px; }
[data-layer="z3"] { transform-origin: 115px 4px; }
.shadow { fill: var(--robot-shadow); }
.shell { fill: var(--robot-body); }
.ear, .hand, .foot, .limb-fill { fill: var(--robot-body-shade); }
.limb { fill: none; stroke: var(--robot-body-shade); stroke-width: 8; stroke-linecap: round; }
.sheen { fill: none; stroke: var(--robot-glint); stroke-width: 3.6; stroke-linecap: round; opacity: .55; }
.tunic { fill: var(--robot-tunic); }
.sash { fill: var(--robot-sash); }
.brooch, .socket { fill: var(--robot-gold); }
.brooch-pin { fill: var(--robot-gold-deep); }
.fire { fill: var(--robot-flame); stroke: var(--robot-flame); stroke-width: 0; stroke-linejoin: round; }
.fire-core { fill: var(--robot-flame-core); }
.screen, .lid { fill: var(--robot-screen); }
.eye, .mouth-fill { fill: var(--robot-eye); }
.glint { fill: var(--robot-glint); }
.eye .glint, .eye-open .glint { opacity: .95; }
.eye-line, .mouth-line { fill: none; stroke: var(--robot-eye); stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
.mouth-line { stroke-width: 2.6; }
.eye-joy, .eye-closed, .mouth-alt { opacity: 0; }
.tongue { fill: var(--robot-pink); }
.tear { fill: var(--robot-eye); opacity: 0; }
.lid { transform: scaleY(0); transition: transform .07s ease-in; }
.z { fill: none; stroke: var(--robot-body-shade); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.star { fill: var(--robot-accent); }
.heart { fill: var(--robot-pink); }
.dot { fill: var(--robot-body-shade); }
.fx-zzz, .fx-stars, .fx-dots { opacity: 0; }
svg.blinking[data-state] [data-layer^="lid-"] { transform: scaleY(1); }
svg[data-state="thinking"] [data-layer="head"] { transform: rotate(4deg); }
svg[data-state="thinking"] [data-layer="eyes"] { transform: translate(4px, -4px); }
svg[data-state="thinking"] [data-layer="mouth-smile"] { opacity: 0; }
svg[data-state="thinking"] [data-layer="mouth-flat"] { opacity: 1; }
svg[data-state="thinking"] [data-layer="arm-right"] { transform: rotate(-128deg); }
svg[data-state="thinking"] [data-layer="forearm-right"] { transform: rotate(-40deg); }
svg[data-state="working"] [data-layer="lid-left"] { transform: scaleY(.3); }
svg[data-state="working"] [data-layer="lid-right"] { transform: scaleY(.3); }
svg[data-state="working"] [data-layer="mouth-smile"] { opacity: 0; }
svg[data-state="working"] [data-layer="mouth-flat"] { opacity: 1; }
svg[data-state="working"] [data-layer="arm-left"] { transform: rotate(40deg); }
svg[data-state="working"] [data-layer="arm-right"] { transform: rotate(-40deg); }
svg[data-state="working"] [data-layer="forearm-left"] { transform: rotate(-50deg); }
svg[data-state="working"] [data-layer="forearm-right"] { transform: rotate(50deg); }
svg[data-state="working"] [data-layer="fire"] { transform: scale(1.15, 1.3); }
svg[data-state="success"] [data-layer="eye-open-left"] { opacity: 0; }
svg[data-state="success"] [data-layer="eye-open-right"] { opacity: 0; }
svg[data-state="success"] [data-layer="eye-joy-left"] { opacity: 1; }
svg[data-state="success"] [data-layer="eye-joy-right"] { opacity: 1; }
svg[data-state="success"] [data-layer="mouth-smile"] { opacity: 0; }
svg[data-state="success"] [data-layer="mouth-open"] { opacity: 1; }
svg[data-state="success"] [data-layer="arm-left"] { transform: rotate(100deg); }
svg[data-state="success"] [data-layer="arm-right"] { transform: rotate(-100deg); }
svg[data-state="success"] [data-layer="forearm-left"] { transform: rotate(30deg); }
svg[data-state="success"] [data-layer="forearm-right"] { transform: rotate(-30deg); }
svg[data-state="success"] [data-layer="fx-stars"] { opacity: 1; }
svg[data-state="success"] .star { transform-box: fill-box; transform-origin: center; }
svg[data-state="success"] .heart { transform-box: fill-box; transform-origin: center; }
svg[data-state="error"] [data-layer="rig"] { transform: translateY(2px); }
svg[data-state="error"] [data-layer="head"] { transform: rotate(-5deg); }
svg[data-state="error"] [data-layer="lid-left"] { transform: rotate(-14deg) scaleY(.32); }
svg[data-state="error"] [data-layer="lid-right"] { transform: rotate(14deg) scaleY(.32); }
svg[data-state="error"] [data-layer="eyes"] { transform: translateY(2px); }
svg[data-state="error"] [data-layer="mouth-smile"] { opacity: 0; }
svg[data-state="error"] [data-layer="mouth-frown"] { opacity: 1; }
svg[data-state="error"] [data-layer="arm-left"] { transform: rotate(-14deg); }
svg[data-state="error"] [data-layer="arm-right"] { transform: rotate(14deg); }
svg[data-state="error"] [data-layer="flame"] { transform: rotate(-22deg); }
svg[data-state="error"] .fire { fill: var(--robot-alert); stroke: var(--robot-alert); }
svg[data-state="error"] [data-layer="tear"] { opacity: 1; }
svg[data-state="sleep"] [data-layer="rig"] { transform: translateY(1px); }
svg[data-state="sleep"] [data-layer="head"] { transform: rotate(-7deg); }
svg[data-state="sleep"] [data-layer="flame"] { transform: rotate(-12deg); }
svg[data-state="sleep"] [data-layer="eye-open-left"] { opacity: 0; }
svg[data-state="sleep"] [data-layer="eye-open-right"] { opacity: 0; }
svg[data-state="sleep"] [data-layer="eye-closed-left"] { opacity: 1; }
svg[data-state="sleep"] [data-layer="eye-closed-right"] { opacity: 1; }
svg[data-state="sleep"] [data-layer="mouth-smile"] { opacity: 0; }
svg[data-state="sleep"] [data-layer="mouth-o"] { opacity: 1; }
svg[data-state="sleep"] [data-layer="fire"] { transform: scale(.45); opacity: .5; }
svg[data-state="sleep"] .fire-core { opacity: 0; }
svg[data-state="sleep"] [data-layer="fx-zzz"] { opacity: 1; }
svg[data-state="waiting"] [data-layer="head"] { transform: rotate(-6deg); }
svg[data-state="waiting"] [data-layer="eyes"] { transform: translate(5px, -4px); }
svg[data-state="waiting"] [data-layer="mouth-smile"] { opacity: 0; }
svg[data-state="waiting"] [data-layer="mouth-o"] { opacity: 1; }
svg[data-state="waiting"] [data-layer="fx-dots"] { opacity: 1; }svg.small [data-layer="frame"] { transform: translateY(20px) scale(1.4); }svg.small [data-layer="base"], svg.small [data-layer="body"], svg.small [data-layer="arm-left"], svg.small [data-layer="arm-right"], svg.small [data-layer="accessories"], svg.small [data-layer="fx"], svg.small .ear, svg.small .sheen, svg.small .glint-small, svg.small .tear, svg.small .fire-core, svg.small .socket { display: none; }svg.small .fire { stroke-width: 4.5; }svg.small .eye-line { stroke-width: 6; }svg.small .mouth-line { stroke-width: 4; }
@media (max-width: 40px) { svg [data-layer="frame"] { transform: translateY(20px) scale(1.4); }svg [data-layer="base"], svg [data-layer="body"], svg [data-layer="arm-left"], svg [data-layer="arm-right"], svg [data-layer="accessories"], svg [data-layer="fx"], svg .ear, svg .sheen, svg .glint-small, svg .tear, svg .fire-core, svg .socket { display: none; }svg .fire { stroke-width: 4.5; }svg .eye-line { stroke-width: 6; }svg .mouth-line { stroke-width: 4; }
}
@container (max-width: 40px) { svg [data-layer="frame"] { transform: translateY(20px) scale(1.4); }svg [data-layer="base"], svg [data-layer="body"], svg [data-layer="arm-left"], svg [data-layer="arm-right"], svg [data-layer="accessories"], svg [data-layer="fx"], svg .ear, svg .sheen, svg .glint-small, svg .tear, svg .fire-core, svg .socket { display: none; }svg .fire { stroke-width: 4.5; }svg .eye-line { stroke-width: 6; }svg .mouth-line { stroke-width: 4; }
}</style>
  <defs>
    <linearGradient id="trr-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".4" stop-color="#0b1330" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1330" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="trr-sheen" cx=".32" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="trr-glow" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="trr-torso"><rect x="42" y="78" width="44" height="30" rx="15"/></clipPath>
  </defs>
  <g data-layer="frame">
  <g data-layer="base">
    <ellipse class="shadow" cx="64" cy="119" rx="27" ry="4.6"/>
