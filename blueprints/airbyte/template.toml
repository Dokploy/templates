[[config.mounts]]
filePath = "./config/k3s-resources.yaml"
content = """
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airbyte-admin
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airbyte-admin-role
  namespace: default
rules:
  - apiGroups: ["*"]
    resources:
      - configmaps
      - endpoints
      - jobs
      - pods
      - pods/log
      - pods/exec
      - pods/attach
      - secrets
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airbyte-admin-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airbyte-admin-role
subjects:
  - kind: ServiceAccount
    name: airbyte-admin
    namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-db-svc
  namespace: default
spec:
  type: ExternalName
  externalName: db
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-minio-svc
  namespace: default
spec:
  type: ExternalName
  externalName: minio
  ports:
    - name: api
      port: 9000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-temporal
  namespace: default
spec:
  type: ExternalName
  externalName: temporal
  ports:
    - name: grpc
      port: 7233
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-airbyte-server-svc
  namespace: default
spec:
  type: ExternalName
  externalName: server
  ports:
    - name: http
      port: 8001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-workload-api-server-svc
  namespace: default
spec:
  type: ExternalName
  externalName: workload-api-server
  ports:
    - name: http
      port: 8007
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: airbyte-airbyte-manifest-server-svc
  namespace: default
spec:
  type: ExternalName
  externalName: manifest-server
  ports:
    - name: http
      port: 8080
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:coredns
rules:
  - apiGroups: [""]
    resources: [endpoints, services, pods, namespaces]
    verbs: [list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
  - kind: ServiceAccount
    name: coredns
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough
        }
        cache 30
        loop
        reload
        loadbalance
        forward . 127.0.0.1:1053
    }
    .:1053 {
        bind 127.0.0.1
        errors
        rewrite stop name regex ^(.+?)(\\.[^.]+\\.svc\\.cluster\\.local|\\.svc\\.cluster\\.local|\\.cluster\\.local)\\.$ {1} answer auto
        forward . __AIRBYTE_K3S_IP__
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.6
          imagePullPolicy: IfNotPresent
          args: [-conf, /etc/coredns/Corefile]
          resources:
            limits:
              memory: 170Mi
            requests:
              cpu: 100m
              memory: 70Mi
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            periodSeconds: 2
      dnsPolicy: Default
      volumes:
        - name: config
          configMap:
            name: coredns
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
spec:
  selector:
    k8s-app: kube-dns
  clusterIP: 10.43.0.10
  ports:
    - name: dns
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
"""

