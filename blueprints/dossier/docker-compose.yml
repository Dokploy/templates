services:
  dossier:
    image: ghcr.io/aientech/dossier:v1.5.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://dossier:${POSTGRES_PASSWORD:?Keep the generated database password}@dossier-postgres:5432/dossier"
      # Optional: an argon2id hash from `hash-password`. When empty, it's derived at
      # startup from DOSSIER_ADMIN_PASSWORD (generated by the template).
      DOSSIER_PASSWORD: "${DOSSIER_PASSWORD:-}"
      DOSSIER_ADMIN_PASSWORD: "${DOSSIER_ADMIN_PASSWORD:-}"
      DOSSIER_SECRET: "${DOSSIER_SECRET:?Keep the generated DOSSIER_SECRET}"
      DOSSIER_DATA_DIR: /data
      DOSSIER_TELEMETRY: "${DOSSIER_TELEMETRY:-off}"
      DOSSIER_BACKUP_RETENTION_DAYS: "${DOSSIER_BACKUP_RETENTION_DAYS:-14}"
      TZ: "${TZ:-UTC}"
    command:
      - sh
      - -c
      - |
        if [ -z "$$DOSSIER_PASSWORD" ]; then
          [ -n "$$DOSSIER_ADMIN_PASSWORD" ] || { echo "Set DOSSIER_ADMIN_PASSWORD or DOSSIER_PASSWORD" >&2; exit 1; }
          DOSSIER_PASSWORD="$$(printf '%s\n' "$$DOSSIER_ADMIN_PASSWORD" | hash-password)"
          export DOSSIER_PASSWORD
        fi
        unset DOSSIER_ADMIN_PASSWORD
        exec ./start.sh
    expose:
      - "3000"
    volumes:
      - dossier-data:/data
    depends_on:
      dossier-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    # The bundled Chromium prints PDFs in this process.
    mem_limit: 1g
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dossier-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_DB: dossier
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Keep the generated database password}"
    volumes:
      - dossier-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *logging

volumes:
  dossier-data:
  dossier-postgres:
