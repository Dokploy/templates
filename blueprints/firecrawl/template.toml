[variables]
main_domain = "${domain}"
app_postgres_password = "${hash:32}"
nuq_postgres_password = "${hash:32}"
redis_password = "${hash:32}"
rabbitmq_password = "${hash:32}"
bull_auth_key = "${hash:32}"
firecrawl_org_id = "${uuid}"
firecrawl_team_id = "${uuid}"
# Dokploy's real hash helper returns exactly N hex characters. Force the UUID
# version and variant nibbles so Firecrawl's strict API-key parser accepts it.
firecrawl_api_key_a = "${hash:12}"
firecrawl_api_key_b = "${hash:3}"
firecrawl_api_key_c = "${hash:15}"
firecrawl_api_key = "fc-${firecrawl_api_key_a}4${firecrawl_api_key_b}8${firecrawl_api_key_c}"
self_hosted_webhook_hmac_secret = "${hash:32}"

[config]
env = [
  "APP_POSTGRES_PASSWORD=${app_postgres_password}",
  "NUQ_POSTGRES_PASSWORD=${nuq_postgres_password}",
  "REDIS_PASSWORD=${redis_password}",
  "RABBITMQ_USER=firecrawl",
  "RABBITMQ_PASSWORD=${rabbitmq_password}",
  "BULL_AUTH_KEY=${bull_auth_key}",
  "FIRECRAWL_ORG_ID=${firecrawl_org_id}",
  "FIRECRAWL_TEAM_ID=${firecrawl_team_id}",
  "FIRECRAWL_API_KEY=${firecrawl_api_key}",
  "NUM_WORKERS_PER_QUEUE=8",
  "CRAWL_CONCURRENT_REQUESTS=10",
  "MAX_CONCURRENT_JOBS=5",
  "BROWSER_POOL_SIZE=5",
  "LOGGING_LEVEL=INFO",
  "DISABLE_ENGPICKER=true",
  "ALLOW_LOCAL_WEBHOOKS=false",
  "BLOCK_MEDIA=true",
  "OPENAI_API_KEY=",
  "OPENAI_BASE_URL=",
  "OPENROUTER_API_KEY=",
  "OLLAMA_BASE_URL=",
  "MODEL_NAME=",
  "MODEL_EMBEDDING_NAME=",
  "SEARCHAPI_API_KEY=",
  "SEARXNG_ENDPOINT=",
  "SEARXNG_ENGINES=",
  "SEARXNG_CATEGORIES=",
  "LLAMAPARSE_API_KEY=",
  "SLACK_WEBHOOK_URL=",
  "PROXY_SERVER=",
  "PROXY_USERNAME=",
  "PROXY_PASSWORD=",
  "SELF_HOSTED_WEBHOOK_URL=",
  "SELF_HOSTED_WEBHOOK_HMAC_SECRET=${self_hosted_webhook_hmac_secret}"
]
mounts = []

[[config.domains]]
serviceName = "gateway"
port = 8080
host = "${main_domain}"
path = "/"
