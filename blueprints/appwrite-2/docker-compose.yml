  appwrite-task-scheduler-executions:
    profiles:
      - separate
    entrypoint: schedule-executions
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    image: appwrite/appwrite:2.3.0
    depends_on:
      - ${_APP_DB_HOST:-postgresql}
      - redis
    environment:
