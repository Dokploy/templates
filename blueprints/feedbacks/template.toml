[variables]
main_domain = "${domain}"
postgres_password = "${hash:64}"
organization_id = "${uuid}"
s3_access_key = "${hash:20}"
s3_secret_key = "${hash:40}"

[config]
env = [
  "APP_ORIGIN=https://${main_domain}",
  "POSTGRES_PASSWORD=${postgres_password}",
  "ORGANIZATION_ID=${organization_id}",
  "TRUST_PROXY_HOPS=1",
  # Bundled SeaweedFS S3 (HTTPS with a self-signed cert). To use external S3 instead,
  # add S3_ENDPOINT, S3_REGION and S3_BUCKET and replace the keys below.
  "S3_ACCESS_KEY_ID=${s3_access_key}",
  "S3_SECRET_ACCESS_KEY=${s3_secret_key}",
]

[[config.domains]]
serviceName = "feedbacks"
port = 3000
host = "${main_domain}"
path = "/"
