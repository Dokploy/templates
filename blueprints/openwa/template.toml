[variables]
main_domain = "${domain}"
engine_type = "whatsapp-web.js"
auto_start_sessions = "true"
timezone = "UTC"

[config]
env = [
  "NODE_ENV=production",
  "PORT=2785",
  "ENGINE_TYPE=${engine_type}",
  "AUTO_START_SESSIONS=${auto_start_sessions}",
  "TZ=${timezone}",
]
mounts = []

[[config.domains]]
serviceName = "openwa"
port = 2_785
host = "${main_domain}"
