services:
  navi-music:
    image: ghcr.io/andre-carbajal/navimusic:4.3.0
    restart: unless-stopped
    depends_on:
      - yt-cipher
    entrypoint:
      - sh
      - -c
      - >-
        java $$JAVA_OPTS -jar /app/NaviMusic.jar nogui --spring.profiles.active=prod;
        code=$$?;
        if [ "$$code" -eq 0 ]; then
        echo "NaviMusic is idle. Set DISCORD_TOKEN and required YouTube credentials in the Environment tab, then redeploy.";
        tail -f /dev/null;
        fi;
        exit $$code
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      YOUTUBE_POTOKEN: ${YOUTUBE_POTOKEN}
      YOUTUBE_VISITOR: ${YOUTUBE_VISITOR}
      YOUTUBE_OAUTH2: ${YOUTUBE_OAUTH2}
      YOUTUBE_CIPHER_URL: http://yt-cipher:8001
      YOUTUBE_CIPHER_PASSWORD: ${YOUTUBE_CIPHER_PASSWORD}

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      OVERRIDE_PLAYER_VARIANT: IAS
      API_TOKEN: ${YOUTUBE_CIPHER_PASSWORD}
