      );
      --> statement-breakpoint
      CREATE TABLE "keyless_credit_usage" (
        "id" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name "keyless_credit_usage_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),
