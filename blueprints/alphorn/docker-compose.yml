services:
  alphorn:
    image: ghcr.io/alphorn-dev/alphorn:1.4.0
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://alphorn:${POSTGRES_PASSWORD}@postgres:5432/alphorn
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphorn
      POSTGRES_DB: alphorn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphorn -d alphorn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
