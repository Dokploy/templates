[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
auth_secret = "${base64:32}"
encryption_key = "${base64:32}"

[config]
[[config.domains]]
serviceName = "zeqqat"
port = 3000
host = "${main_domain}"

[config.env]
ZEQQAT_PUBLIC_URL = "https://${main_domain}"
POSTGRES_PASSWORD = "${postgres_password}"
BETTER_AUTH_SECRET = "${auth_secret}"
ZEQQAT_ENCRYPTION_KEY = "${encryption_key}"
# Sign-in is email and password, nothing to set up: the first account you
# create owns this Zeqqat. To also offer GitHub or Google, set
# ENABLED_AUTH_PROVIDERS (for example password,github) and that provider's
# client id and secret, with the callback
# https://<your domain>/api/auth/callback/github
