[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
secret_key_base = "${base64:64}"

[config]
env = [
  "OPENPROJECT_HOST__NAME=${main_domain}",
  "POSTGRES_PASSWORD=${postgres_password}",
  "SECRET_KEY_BASE=${secret_key_base}",
  "OPENPROJECT_HTTPS=true",
  "OPENPROJECT_CACHE__EXPIRES__IN__SECONDS=3600",
  "SMTP_HOST=",
  "SMTP_PORT=587",
  "SMTP_DOMAIN=",
  "SMTP_USERNAME=",
  "SMTP_PASSWORD=",
  "SMTP_AUTHENTICATION=login",
  "SMTP_STARTTLS=true",
  "SMTP_VERIFY_MODE=peer",
  "IMAP_ENABLED=false",
  "IMAP_ALLOW_OVERRIDE=type,project,priority,status,responsible,assigned_to,estimated_hours,remaining_hours",
  "IMAP_HOST=",
  "IMAP_PORT=993",
  "IMAP_USERNAME=",
  "IMAP_PASSWORD=",
  "IMAP_CHECK_INTERVAL=600",
  "ATTACHMENTS_STORAGE=file",
  "S3_BUCKET=",
  "S3_ACCESS_KEY=",
  "S3_SECRET_KEY=",
  "S3_REGION=",
  "S3_ENDPOINT=",
]

[[config.domains]]
serviceName = "web"
port = 8080
host = "${main_domain}"
