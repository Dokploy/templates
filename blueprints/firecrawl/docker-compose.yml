        "last_used_at" timestamp with time zone DEFAULT now() NOT NULL
      );
      --> statement-breakpoint
      CREATE TABLE "eb-sync" (
        "id" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name "eb-sync_id_seq" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "team_id" text
