[variables]
main_domain = "${domain}"
nextauth_secret = "${base64:36}"
meili_master_key = "${base64:36}"

[config]
env = [
  "NEXTAUTH_URL=http://${main_domain}",
  "NEXTAUTH_SECRET=${nextauth_secret}",
  "MEILI_MASTER_KEY=${meili_master_key}",
  "DISABLE_SIGNUPS=false",
  "# Optional: enable AI auto-tagging (see https://docs.karakeep.app/configuration/environment-variables)",
  "# OPENAI_API_KEY=",
  "# OLLAMA_BASE_URL=",
  "# INFERENCE_TEXT_MODEL=gpt-4.1-mini",
  "# INFERENCE_IMAGE_MODEL=gpt-4o-mini",
]
mounts = []

[[config.domains]]
serviceName = "karakeep"
port = 3_000
host = "${main_domain}"
