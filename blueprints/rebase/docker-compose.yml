services:
  rebase:
    image: rebasepro/server:0.37.0
    restart: unless-stopped
    expose:
      - 8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      REBASE_SERVICE_KEY: ${REBASE_SERVICE_KEY}
      CORS_ORIGINS: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      # The first admin account, created once while the users table is empty.
      # Sign in with it, then change the password.
      REBASE_ADMIN_EMAIL: ${REBASE_ADMIN_EMAIL}
      REBASE_ADMIN_PASSWORD: ${REBASE_ADMIN_PASSWORD}
      DISABLE_SELF_REGISTRATION: "true"
      # Uploads go to the rebase_storage volume, which survives redeploys.
      # Switch to STORAGE_TYPE=s3 to use a bucket instead.
      STORAGE_PATH: /storage/uploads
      FORCE_LOCAL_STORAGE: "true"
    volumes:
      - rebase_storage:/storage

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rebase_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rebase_storage:
  rebase_db:
