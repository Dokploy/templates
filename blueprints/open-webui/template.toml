[variables]
main_domain = "${domain}"
webui_secret_key = "${password:32}"

[config]
mounts = []
[[config.domains]]
serviceName = "open-webui"
port = 8080
host = "${main_domain}"

[config.env]
# Secret key for signing JWTs for authentication.
# A random key is generated by default.
webui_secret_key = "${webui_secret_key}" # API Key
