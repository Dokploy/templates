[variables]
FLUXER_DOMAIN = "${domain}"
FLUXER_PUBLIC_SCHEME = "http"
FLUXER_PUBLIC_PORT = "80"

POSTGRES_PASSWORD = "${hash:64}"
MEILI_MASTER_KEY = "${hash:64}"
FLUXER_S3_ACCESS_KEY = "fluxer"
FLUXER_S3_SECRET_KEY = "${hash:64}"

FLUXER_SUDO_MODE_SECRET = "${hash:64}"
FLUXER_CONNECTION_INITIATION_SECRET = "${hash:64}"
FLUXER_GATEWAY_RPC_AUTH_TOKEN = "${hash:64}"
FLUXER_MEDIA_PROXY_SECRET_KEY = "${hash:64}"
FLUXER_ADMIN_SECRET_KEY_BASE = "${hash:64}"
FLUXER_ADMIN_OAUTH_CLIENT_SECRET = "${hash:64}"

FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64 = "${base64:32}"

FLUXER_VAPID_PUBLIC_KEY = "${password:64}"
FLUXER_VAPID_PRIVATE_KEY = "${password:32}"
FLUXER_VAPID_EMAIL = "admin@example.com"

LIVEKIT_API_KEY = "fluxer"
LIVEKIT_API_SECRET = "${hash:64}"

FLUXER_PASSKEY_RP_NAME = "Fluxer"
FLUXER_PASSKEY_RP_ID = "${FLUXER_DOMAIN}"
FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS = "http://${FLUXER_DOMAIN}"

FLUXER_EMAIL_ENABLED = "false"
FLUXER_EMAIL_PROVIDER = "none"
FLUXER_EMAIL_FROM_EMAIL = "noreply@example.com"
FLUXER_EMAIL_FROM_NAME = "Fluxer"
FLUXER_EMAIL_SMTP_HOST = ""
FLUXER_EMAIL_SMTP_PORT = "587"
FLUXER_EMAIL_SMTP_USERNAME = ""
FLUXER_EMAIL_SMTP_PASSWORD = ""
FLUXER_EMAIL_SMTP_SECURE = "true"

FLUXER_CAPTCHA_ENABLED = "false"
FLUXER_CAPTCHA_PROVIDER = "none"
FLUXER_DISCOVERY_ENABLED = "true"
FLUXER_KLIPY_API_KEY = ""

[config]
env = [
  "# HTTPS SETUP INSTRUCTIONS:",
  "# By default, this template starts over HTTP for initial testing/setup.",
  "# To enable HTTPS (Required for most services to work!)",
  "# 1. Change FLUXER_PUBLIC_SCHEME from 'http' to 'https'",
  "# 2. Change FLUXER_PUBLIC_PORT from '80' to '443'",
  "# 3. Enable HTTPS on your domain in the Dokploy Domains tab and change it if needed.",
  "# 4. Change FLUXER_DOMAIN from ${FLUXER_DOMAIN} to the new domain if needed.",
  "# 5. Change FLUXER_PASSKEY_RP_ID from ${FLUXER_DOMAIN} to the new domain if needed.",
  "# 6. Update FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS from ${FLUXER_DOMAIN} to the new domain if needed.",
  "",
  "# The FLUXER_DOMAIN and FLUXER_PASSKEY_RP_ID should not have http/https at the start.",
  "",
  "FLUXER_DOMAIN=${FLUXER_DOMAIN}",
  "FLUXER_PUBLIC_SCHEME=${FLUXER_PUBLIC_SCHEME}",
  "FLUXER_PUBLIC_PORT=${FLUXER_PUBLIC_PORT}",
  "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}",
  "MEILI_MASTER_KEY=${MEILI_MASTER_KEY}",
  "FLUXER_S3_ACCESS_KEY=${FLUXER_S3_ACCESS_KEY}",
  "FLUXER_S3_SECRET_KEY=${FLUXER_S3_SECRET_KEY}",
  "FLUXER_SUDO_MODE_SECRET=${FLUXER_SUDO_MODE_SECRET}",
  "FLUXER_CONNECTION_INITIATION_SECRET=${FLUXER_CONNECTION_INITIATION_SECRET}",
  "FLUXER_GATEWAY_RPC_AUTH_TOKEN=${FLUXER_GATEWAY_RPC_AUTH_TOKEN}",
  "FLUXER_MEDIA_PROXY_SECRET_KEY=${FLUXER_MEDIA_PROXY_SECRET_KEY}",
  "FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64=${FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64}",
  "FLUXER_ADMIN_SECRET_KEY_BASE=${FLUXER_ADMIN_SECRET_KEY_BASE}",
  "FLUXER_ADMIN_OAUTH_CLIENT_SECRET=${FLUXER_ADMIN_OAUTH_CLIENT_SECRET}",
  "",
  "FLUXER_VAPID_PUBLIC_KEY=${FLUXER_VAPID_PUBLIC_KEY}",
  "FLUXER_VAPID_PRIVATE_KEY=${FLUXER_VAPID_PRIVATE_KEY}",
  "FLUXER_VAPID_EMAIL=${FLUXER_VAPID_EMAIL}",
  "",
  "LIVEKIT_API_KEY=${LIVEKIT_API_KEY}",
  "LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}",
  "",
  "FLUXER_PASSKEY_RP_NAME=${FLUXER_PASSKEY_RP_NAME}",
  "FLUXER_PASSKEY_RP_ID=${FLUXER_PASSKEY_RP_ID}",
  "FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS=${FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS}",
  "",
  "FLUXER_EMAIL_ENABLED=${FLUXER_EMAIL_ENABLED}",
  "FLUXER_EMAIL_PROVIDER=${FLUXER_EMAIL_PROVIDER}",
  "FLUXER_EMAIL_FROM_EMAIL=${FLUXER_EMAIL_FROM_EMAIL}",
  "FLUXER_EMAIL_FROM_NAME=${FLUXER_EMAIL_FROM_NAME}",
  "FLUXER_EMAIL_SMTP_HOST=${FLUXER_EMAIL_SMTP_HOST}",
  "FLUXER_EMAIL_SMTP_PORT=${FLUXER_EMAIL_SMTP_PORT}",
  "FLUXER_EMAIL_SMTP_USERNAME=${FLUXER_EMAIL_SMTP_USERNAME}",
  "FLUXER_EMAIL_SMTP_PASSWORD=${FLUXER_EMAIL_SMTP_PASSWORD}",
  "FLUXER_EMAIL_SMTP_SECURE=${FLUXER_EMAIL_SMTP_SECURE}",
  "",
  "FLUXER_CAPTCHA_ENABLED=${FLUXER_CAPTCHA_ENABLED}",
  "FLUXER_CAPTCHA_PROVIDER=${FLUXER_CAPTCHA_PROVIDER}",
  "FLUXER_DISCOVERY_ENABLED=${FLUXER_DISCOVERY_ENABLED}"
  "",
  "FLUXER_KLIPY_API_KEY=${FLUXER_KLIPY_API_KEY}",
]
mounts = []

[[config.domains]]
serviceName = "caddy"
port = 80
host = "${FLUXER_DOMAIN}"