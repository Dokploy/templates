version: "3.8"
services:
  fitv-video-starter:
    image: san8888/fitv-video-starter:1.0.0
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - PORT=3000
      - FREEIMAGETOVIDEO_API_KEY=${FREEIMAGETOVIDEO_API_KEY}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
