services:
  app:
    image: ghcr.io/tj-coding/life-console:0.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lifeconsole:${DB_PASSWORD}@db:5432/lifeconsole
      APP_URL: ${APP_URL}
      TRUST_PROXY: "1"
      SIGNUPS: open
      AUTH_PASSWORD: "on"
      UPDATE_CHECK: "off"
      BACKUP_DIR: /backups
    expose:
      - 8080
    volumes:
      - backups:/backups

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeconsole
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lifeconsole
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
  backups:
