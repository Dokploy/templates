
services:
  calnode:
    image: ghcr.io/calnode/calnode:0.12
    restart: unless-stopped

    volumes:
      - calnode_data:/data

    expose:
      - "3000"

    environment:
      PORT: ${PORT}
      BASE_URL: ${BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      CALNODE_ENCRYPTION_KEY: ${CALNODE_ENCRYPTION_KEY}
      CALNODE_RECOVERY_SECRET: ${CALNODE_RECOVERY_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT : ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_CONNECT_HOST: ${EMAIL_SMTP_CONNECT_HOST}
      EMAIL_SMTP_CONNECT_PORT: ${EMAIL_SMTP_CONNECT_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASS : ${EMAIL_SMTP_PASS}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS}
      EMAIL_SMTP_STARTTLS: ${EMAIL_SMTP_STARTTLS}
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_REGION: ${LITESTREAM_REGION}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS}
      LOG_LEVEL: ${LOG_LEVEL}

    
volumes:
  calnode_data:
