[variables]
main_domain = "${domain}"
db_password = "${password:24}"
db_user = "${username}"

[config]
mounts = []
[[config.domains]]
serviceName = "gitea"
port = 3000
host = "${main_domain}"

[config.env]
USER_UID = "1000"
USER_GID = "1000"
GITEA_DOMAIN = "${main_domain}"
GITEA_SSH_DOMAIN = "${main_domain}"
POSTGRES_USER = "${db_user}"
POSTGRES_PASSWORD = "${db_password}"
POSTGRES_DB = "gitea"
