services:
  esphome:
    image: ghcr.io/esphome/esphome:2026.11.1
    restart: unless-stopped
    environment:
      # Dashboard (Device Builder) login. The password is generated by
      # Dokploy at deploy time — find it in the stack env var ESPHOME_PASSWORD.
      - ESPHOME_USERNAME=admin
      - ESPHOME_PASSWORD=${ESPHOME_PASSWORD}
    volumes:
      - esphome_config:/config
    expose:
      - "6052"

volumes:
  esphome_config:
