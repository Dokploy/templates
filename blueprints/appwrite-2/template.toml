# Appwrite 2 exposes the API, the Console, Sites and Functions on separate hosts.
# Defaults below keep a single main domain for API + Console while Sites and
# Functions live on their own subdomains. To separate the Console from the API
# (e.g. to protect it behind Cloudflare Access without exposing the public API),
# change `console_domain` to a dedicated host such as "console.example.com".
#   API        -> ${main_domain}/v1        (and /v1/realtime, /.well-known)
#   Console    -> ${console_domain}/
#   Sites      -> ${sites_domain}
#   Functions  -> ${functions_domain}
[variables]
main_domain = "${domain}"
console_domain = "console.${main_domain}"
functions_domain = "functions.${main_domain}"
sites_domain = "sites.${main_domain}"
openssl_key = "${password:32}"
notifications_tracking_secret = "${password:32}"
db_root_pw = "${password:32}"
db_user_pw = "${password:32}"
executor_secret = "${password:32}"
jobs_secret = "${password:32}"
usage_pass = "${password:32}"
geo_secret = "${password:32}"

[config]
env = [
  "_APP_ENV=production",
  "_APP_EDITION=self-hosted",
  "_APP_LOCALE=en",
  "_APP_OPENSSL_KEY_V1=${openssl_key}",
