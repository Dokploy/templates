services:
  postgres-extensor:
    image: ruxwez/postgres:18-v1.1.0
    restart: unless-stopped
    # Libraries loaded at startup. pg_cron and the other "preload" extensions
    # need to be listed here before CREATE EXTENSION works.
    command:
      - postgres
      - -c
      - shared_preload_libraries=${SHARED_PRELOAD_LIBRARIES}
      - -c
      - cron.database_name=${POSTGRES_DB}
      - -c
      - max_worker_processes=32
    # Uncomment 'ports' settings below to enable external access
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
