[variables]
main_domain = "${domain}"
auth_password = "${password:32}"

[config]
[[config.domains]]
serviceName = "maintenant"
port = 8080
host = "${main_domain}"

[config.env]
AUTH_USER = "admin"
AUTH_PASSWORD = "${auth_password}"
MAINTENANT_BASE_URL = "https://${main_domain}"

[[config.mounts]]
filePath = "/default.conf"
content = """
server {
    listen 8080;
    server_name _;

    auth_basic "maintenant";
    auth_basic_user_file /tmp/htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location ~ ^/((ping|status|assets|screenshots)(/|$)|workbox-|favicon|icon|(sw|registerSW)[.]js$|manifest[.]webmanifest$|apple-touch-icon[.]png$|logo[.]svg$) {
        auth_basic off;
        proxy_pass http://maintenant-app:8080;
    }

    location / {
        proxy_pass http://maintenant-app:8080;
    }
}
"""
