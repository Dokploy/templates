    command:
      - "bundle"
      - "exec"
      - "puma"
      - "-b"
      - "tcp://0.0.0.0:3000"
    expose:
      - 3000
    labels:
      - "traefik.http.services.${APP_NAME}-links.loadbalancer.server.port=3000"
      - "traefik.http.routers.${APP_NAME}-links.rule=HostRegexp(`^[a-z0-9-]+\\.${DOMAIN_LIVE}$$`) || HostRegexp(`^[a-z0-9-]+\\.${DOMAIN_TEST}$$`)"
      - "traefik.http.routers.${APP_NAME}-links.entrypoints=web"
      - "traefik.http.routers.${APP_NAME}-links.priority=1"
      - "traefik.http.routers.${APP_NAME}-links.service=${APP_NAME}-links"
      - "traefik.http.routers.${APP_NAME}-links-secure.rule=HostRegexp(`^[a-z0-9-]+\\.${DOMAIN_LIVE}$$`) || HostRegexp(`^[a-z0-9-]+\\.${DOMAIN_TEST}$$`)"
      - "traefik.http.routers.${APP_NAME}-links-secure.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-links-secure.priority=1"
      - "traefik.http.routers.${APP_NAME}-links-secure.service=${APP_NAME}-links"
      - "traefik.http.routers.${APP_NAME}-links-secure.tls=true"
      - "traefik.http.routers.${APP_NAME}-links-secure.tls.certresolver=${GROVS_CERT_RESOLVER:-}"
      - "traefik.http.routers.${APP_NAME}-links-secure.tls.domains[0].main=${DOMAIN_LIVE}"
      - "traefik.http.routers.${APP_NAME}-links-secure.tls.domains[0].sans=*.${DOMAIN_LIVE}"
      - "traefik.http.routers.${APP_NAME}-links-secure.tls.domains[1].main=${DOMAIN_TEST}"
      - "traefik.http.routers.${APP_NAME}-links-secure.tls.domains[1].sans=*.${DOMAIN_TEST}"
