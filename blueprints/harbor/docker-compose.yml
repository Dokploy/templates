  "exporter":
    "image": "goharbor/harbor-exporter:v2.15.4@sha256:9ffede33dc519b4be035596a72f00f354754a22a3769077731f81ee7d6852f4f"
    "platform": "linux/amd64"
    "restart": "unless-stopped"
    "labels":
      "io.harbor-dokploy.instance": "${HARBOR_INSTANCE_ID:?Set HARBOR_INSTANCE_ID in Dokploy Environment}"
      "io.harbor-dokploy.role": "workload"
      "traefik.enable": "false"
    "entrypoint":
