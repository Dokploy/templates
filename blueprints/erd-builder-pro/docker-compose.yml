services:
  erd-builder-pro:
    image: bekenweb/erd-builder-pro:3.5.6
    restart: unless-stopped
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/erd_builder_pro
      - ERD_ENCRYPTION_KEY=${ERD_ENCRYPTION_KEY}
      - ERDBPRO_LICENSE_STATE_FILE=/app/data/.erdbpro/license-state.json
    volumes:
      - erd-builder-pro-data:/app/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=erd_builder_pro
    volumes:
      - erd-builder-pro-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "erd_builder_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  erd-builder-pro-data: {}
  erd-builder-pro-db: {}
