[config]
env = [
  # Required: create a Discord bot and paste its token.
  "DISCORD_TOKEN=",
  # Optional but recommended for Spotify links: https://developer.spotify.com/dashboard
  "SPOTIFY_CLIENT_ID=",
  "SPOTIFY_CLIENT_SECRET=",
  "# Optional YouTube authentication. See NaviMusic's README for how to obtain these values.",
  "YOUTUBE_POTOKEN=",
  "YOUTUBE_VISITOR=",
  "YOUTUBE_OAUTH2=",
]
