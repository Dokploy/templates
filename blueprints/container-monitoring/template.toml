[variables]
main_domain = "${domain}"
grafana_admin_password = "${password:24}"

[config.env]
GRAFANA_ADMIN_PASSWORD = "${grafana_admin_password}"

[[config.domains]]
serviceName = "grafana"
port = 3000
host = "${main_domain}"

[[config.mounts]]
filePath = "/prometheus.yml"
content = '''
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
'''

[[config.mounts]]
filePath = "/grafana/datasources.yml"
content = '''
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
'''

[[config.mounts]]
filePath = "/grafana/dashboards.yml"
content = '''
apiVersion: 1

providers:
  - name: containers
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
'''

[[config.mounts]]
filePath = "/grafana/cluster-overview.json"
content = '''
{
  "annotations": { "list": [] },
  "editable": true,
  "graphTooltip": 1,
  "links": [],
  "panels": [
    {
      "id": 1,
      "type": "stat",
      "title": "CPU used",
      "datasource": { "type": "prometheus", "uid": "prometheus" },
