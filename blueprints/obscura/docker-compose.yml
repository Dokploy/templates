version: "3.8"

services:
  obscura-cdp:
    image: h4ckf0r0day/obscura:0.2.1
    restart: unless-stopped
    command: ["serve", "--host", "0.0.0.0", "--port", "9222", "--stealth", "--storage-dir", "/data"]
    expose:
      - "9222"
    volumes:
      - obscura-data:/data

  obscura-mcp:
    image: h4ckf0r0day/obscura:0.2.1
    restart: unless-stopped
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "3000", "--stealth"]
    environment:
      OBSCURA_MCP_ALLOWED_ORIGINS: https://${OBSCURA_HOST}
    expose:
      - "3000"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      OBSCURA_HOST: ${OBSCURA_HOST}
      OBSCURA_API_TOKEN: ${OBSCURA_API_TOKEN}
    volumes:
      - ../files/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - obscura-cdp
      - obscura-mcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  obscura-data:
