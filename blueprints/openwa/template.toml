[variables]
main_domain = "${domain}"
engine_type = "whatsapp-web.js"
auto_start_sessions = "true"
timezone = "UTC"
# Set to "true" only when the dashboard is reached exclusively through a TLS-terminating proxy.
# Left "false" so the bundled SPA loads over plain HTTP (see comments in docker-compose.yml).
csp_upgrade_insecure_requests = "false"
# The MCP server is opt-in upstream. Enabled here so the template exposes POST /mcp by default.
# Read-only is the upstream-recommended default; set to "false" to mount the write tools too.
mcp_enabled = "true"
mcp_readonly = "true"
# Swagger UI at /api/docs. Upstream disables it under NODE_ENV=production by default.
# Note: the docs mount is not behind the API-key guard, so it exposes the schema publicly.
enable_swagger = "true"

[config]
env = [
  "NODE_ENV=production",
  "PORT=2785",
  "ENGINE_TYPE=${engine_type}",
  "AUTO_START_SESSIONS=${auto_start_sessions}",
  "TZ=${timezone}",
  "CSP_UPGRADE_INSECURE_REQUESTS=${csp_upgrade_insecure_requests}",
  "MCP_ENABLED=${mcp_enabled}",
  "MCP_READONLY=${mcp_readonly}",
  "ENABLE_SWAGGER=${enable_swagger}",
]
mounts = []

[[config.domains]]
serviceName = "openwa"
port = 2_785
host = "${main_domain}"
