version: "3.8"
services:
  databasement:
    image: davidcrty/databasement:1.8.4
    restart: unless-stopped
    expose:
      - 2226
    environment:
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/data/database.sqlite
      - ENABLE_QUEUE_WORKER=true
      - TRUSTED_PROXIES=*
      - LOG_CHANNEL=stderr
      - APP_DISPLAY_TIMEZONE=${APP_DISPLAY_TIMEZONE}
    volumes:
      - databasement-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2226/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  databasement-data:
