# dokploy: allow-host-ports — DNS clients must reach Sable directly over raw TCP/UDP; Traefik cannot route DNS traffic.
# The DNS host port defaults to 1053 because port 53 is usually taken on the host (e.g. systemd-resolved).
# To serve DNS on the standard port, free port 53 on the host and set SABLE_DNS_PORT=53.
services:
  sable:
    image: ghcr.io/drudge/sable:1.6.1
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 9.9.9.9
    ports:
      - "${SABLE_DNS_PORT:-1053}:8053/tcp"
      - "${SABLE_DNS_PORT:-1053}:8053/udp"
    expose:
      - 5380
    environment:
      - TZ=${TZ}
      - SABLE_WEB_UPDATES=${SABLE_WEB_UPDATES}
    volumes:
      - sable-data:/data

volumes:
  sable-data: {}
