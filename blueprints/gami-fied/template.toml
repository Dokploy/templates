[variables]
main_domain = "${domain}"

[config]
mounts = []

[[config.domains]]
serviceName = "dashboard"
port = 3000
host = "${main_domain}"

[config.env]
GAMI_VERSION = "1.3.0"
PUBLIC_URL = "https://${main_domain}"
POSTGRES_PASSWORD = "${password:32}"
REDIS_PASSWORD = "${password:32}"
BETTER_AUTH_SECRET = "${base64:48}"
ENCRYPTION_MASTER_KEY = "${base64:48}"
PLATFORM_BOOTSTRAP_SECRET = "${base64:48}"
