services:
  postgres:
    image: "postgres:16.10-alpine"
    restart: "unless-stopped"
    environment:
      POSTGRES_USER: "grovs"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "grovs_production"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    volumes:
      - "pg_data:/var/lib/postgresql/data"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: "10s"
      timeout: "5s"
      retries: 10
  redis:
    image: "redis:7.4.5-alpine"
    restart: "unless-stopped"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test:
        - "CMD"
        - "redis-cli"
        - "ping"
      interval: "10s"
      timeout: "5s"
      retries: 10
  clickhouse:
    image: "clickhouse/clickhouse-server:25.3.6.56"
    restart: "unless-stopped"
    environment:
      CLICKHOUSE_DB: "grovs_production"
      CLICKHOUSE_USER: "grovs"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - "clickhouse_data:/var/lib/clickhouse"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "-q"
        - "http://localhost:8123/ping"
      interval: "10s"
      timeout: "5s"
      retries: 30
  migrate:
    image: "ghcr.io/grovs-io/backend:2.3.1"
    restart: "no"
    environment:
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}"
      ACTIVE_STORAGE_SERVICE: "local"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      API_HOST: "api.${SERVER_HOST}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD}"
      CLICKHOUSE_ANALYTICS_ROLLUPS_READ_ENABLED: "true"
      CLICKHOUSE_ATTRIBUTION_READ_ENABLED: "true"
      CLICKHOUSE_DATABASE: "grovs_production"
      CLICKHOUSE_LINK_DIMENSIONS_READ_ENABLED: "true"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_PRIMARY: "true"
      CLICKHOUSE_READ_ENABLED: "true"
      CLICKHOUSE_ROLLUP_FAST_LANE: "true"
      CLICKHOUSE_URL: "http://grovs:${CLICKHOUSE_PASSWORD}@clickhouse:8123"
      CLICKHOUSE_WRITE_ENABLED: "true"
      DASHBOARD_CACHE_TTL_SECONDS: "60"
      DASHBOARD_HOST: "dashboard.${SERVER_HOST}"
      DATABASE_URL: "postgres://grovs:${POSTGRES_PASSWORD}@postgres:5432/grovs_production"
      DEFAULT_LINK_SUBTITLE: "Dynamic links, attributions, and referrals across mobile and web platforms."
      DEFAULT_LINK_TITLE: "grovs"
      DEFAULT_LOGO_URL: "https://appssemble-assets.s3.eu-north-1.amazonaws.com/linksquared/logo-square-new.svg"
      DEFAULT_SOCIAL_PREVIEW_URL: "https://appssemble-assets.s3.eu-north-1.amazonaws.com/linksquared/social-media-placeholder.jpg"
      DIAGNOSTICS_API_KEY: "${DIAGNOSTICS_API_KEY}"
      DOMAIN_LIVE: "${DOMAIN_LIVE}"
      DOMAIN_TEST: "${DOMAIN_TEST}"
      GO_HOST: "go.${SERVER_HOST}"
      GROVS_EE: "false"
      GROVS_SELF_HOSTED: "true"
      LINKS_PROD_HOST: "links.${DOMAIN_LIVE}"
      LINKS_TEST_HOST: "links.${DOMAIN_TEST}"
      MAILER_DELIVERY_METHOD: ""
      MAILER_FROM: "Grovs <noreply@${SERVER_HOST}>"
      MCP_CONSENT_URL: "${SERVER_HOST_PROTOCOL}dashboard.${SERVER_HOST}/mcp/authorize"
      MCP_HOST: "mcp.${SERVER_HOST}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET}"
      OAUTH_CLIENT_UID: "${OAUTH_CLIENT_UID}"
      PG_SHADOW_WRITES: "false"
      POSTGRES_DB: "grovs_production"
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "grovs"
      PREVIEW_BASE_URL: "${SERVER_HOST_PROTOCOL}preview.${SERVER_HOST}"
      PREVIEW_HOST: "preview.${SERVER_HOST}"
      PUBLIC_GO_PROJECT_IDENTIFIER: "go-self-hosted"
      RAILS_DB_POOL: "10"
      RAILS_ENV: "production"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_MAX_THREADS: "5"
      RAILS_SERVE_STATIC_FILES: "true"
      REACT_HOST: "dashboard.${SERVER_HOST}"
      REACT_HOST_PROTOCOL: "${SERVER_HOST_PROTOCOL}"
      REDIS_URL: "redis://redis:6379/0"
      REVENUE_READS_FROM_LEDGER: "true"
      S3_ASSET_PREFIX: "${SERVER_HOST_PROTOCOL}api.${SERVER_HOST}"
      SDK_HOST: "sdk.${SERVER_HOST}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      SENT_QUOTAS_WEBHOOK_KEY: "${SENT_QUOTAS_WEBHOOK_KEY}"
      SERVER_HOST: "${SERVER_HOST}"
      SERVER_HOST_PROTOCOL: "${SERVER_HOST_PROTOCOL}"
      SIDEKIQ_EVENTS_CONCURRENCY: "10"
      SMTP_ADDRESS: "smtp.example.com"
      SMTP_AUTHENTICATION: "plain"
      SMTP_DOMAIN: "${SERVER_HOST}"
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      SMTP_PASSWORD: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      WEB_CONCURRENCY: "2"
    volumes:
      - "storage:/app/storage"
    command:
      - "bash"
      - "-c"
      - "bin/rails db:prepare && bin/rails db:seed && bin/rails clickhouse:setup"
    depends_on:
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
      clickhouse:
        condition: "service_healthy"
  web:
