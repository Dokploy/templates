services:
  frameleaf:
    image: ghcr.io/frameleaf/frameleaf-server:frameleaf-v1.2.3
    restart: unless-stopped
    expose:
      - 2283
    volumes:
      # Originals, thumbnails and encoded video
      - frameleaf-library:/data
      # The Studio render worker enrols from here (read-only on machine learning)
      - frameleaf-studio-worker:/run/frameleaf/studio-worker
    environment:
      DB_HOSTNAME: frameleaf-database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      FRAMELEAF_MACHINE_LEARNING_URL: http://frameleaf-machine-learning:3003
      TZ: ${TZ}
    depends_on:
      frameleaf-database:
        condition: service_healthy
    # Encrypted Locked files are decrypted into /dev/shm for thumbnails, video and ML
    shm_size: 2gb
    stop_grace_period: 10s
    healthcheck:
      disable: false

  frameleaf-machine-learning:
    image: ghcr.io/frameleaf/frameleaf-machine-learning:frameleaf-v1.2.3
    restart: unless-stopped
    volumes:
      - frameleaf-model-cache:/cache
      - frameleaf-studio-worker:/run/frameleaf/studio-worker:ro
    # No database credentials here: the inference worker only needs to reach the server
    environment:
      FRAMELEAF_STUDIO_WORKER_SERVER_URL: http://frameleaf:2283
      TZ: ${TZ}
    healthcheck:
      disable: false

  frameleaf-database:
    image: ghcr.io/frameleaf/frameleaf-postgres:19beta4-pgvector0.8.7@sha256:7b155ed85302ab66c1022309f1f70f0b79f98f70bd52af8d7d3611a0cbf08cf0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # PostgreSQL 18+ layout: mount /var/lib/postgresql, not /var/lib/postgresql/data
      - frameleaf-postgres:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --dbname=\"$${POSTGRES_DB}\" --username=\"$${POSTGRES_USER}\" && /usr/local/bin/healthcheck.sh"]
      interval: 30s
      start_period: 5m
      start_interval: 5s

volumes:
  frameleaf-library:
  frameleaf-model-cache:
  frameleaf-postgres:
  frameleaf-studio-worker:
