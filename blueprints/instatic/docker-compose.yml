version: "3.8"

services:
  instatic:
    image: ghcr.io/corebunch/instatic:0.0.16
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - 3001
    volumes:
      - instatic-storage:/app/storage
    healthcheck:
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  instatic-storage:
    driver: local
