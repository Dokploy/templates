# If you are on a machine with ARM architecture, please add a "-arm" suffix to the calcom image.
# For example, `calcom/cal.com:v6.2.0` will become `calcom/cal.com:v6.2.0-arm`
#
# If serving the instance over https, change NEXT_PUBLIC_WEBAPP_URL, NEXT_PUBLIC_WEBSITE_URL,
# NEXT_PUBLIC_EMBED_LIB_URL and NEXTAUTH_URL in template.toml to use the https scheme.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - calcom-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  calcom:
    image: calcom/cal.com:v6.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 3000
    environment:
      # --- DATABASE ---------------------------------------------------------------------------
      - DATABASE_URL
      - DATABASE_DIRECT_URL
      - INSIGHTS_DATABASE_URL

      # --- SHARED -----------------------------------------------------------------------------
      - NEXT_PUBLIC_WEBAPP_URL
      - NEXT_PUBLIC_WEBSITE_URL
      - NEXT_PUBLIC_EMBED_LIB_URL
      - 'ALLOWED_HOSTNAMES="${ALLOWED_HOSTNAMES}"'
      - 'RESERVED_SUBDOMAINS="app","auth","docs","design","console","go","status","api","saml","www","matrix","developer","cal","my","team","support","security","blog","learn","admin"'
      - SAML_DATABASE_URL
      - SAML_ADMINS
      - NEXT_PUBLIC_HOSTED_CAL_FEATURES
      - PGSSLMODE

      # --- NEXTAUTH ---------------------------------------------------------------------------
      - NEXTAUTH_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_COOKIE_DOMAIN

      - CALCOM_TELEMETRY_DISABLED
      - CRON_API_KEY
      - CRON_ENABLE_APP_SYNC
      - CALENDSO_ENCRYPTION_KEY

      # --- SUPPORT / ANALYTICS WIDGETS --------------------------------------------------------
      - NEXT_PUBLIC_INTERCOM_APP_ID
      - INTERCOM_SECRET
      - INTERCOM_API_TOKEN
      - NEXT_PUBLIC_POSTHOG_KEY
      - NEXT_PUBLIC_POSTHOG_HOST
      - NEXT_PUBLIC_ZENDESK_KEY
      - NEXT_PUBLIC_HELPSCOUT_KEY
      - NEXT_PUBLIC_FRESHCHAT_TOKEN
      - NEXT_PUBLIC_FRESHCHAT_HOST

      # --- URL SHORTENERS ---------------------------------------------------------------------
      - DUB_API_KEY
      - NEXT_PUBLIC_DUB_PROGRAM_ID
      - DUB_SMS_DOMAIN
      - DUB_SMS_FOLDER_ID
      - SINK_API_URL
      - SINK_API_KEY

      # --- OAUTH / CALENDAR INTEGRATIONS ------------------------------------------------------
      - OUTLOOK_LOGIN_ENABLED
      - GOOGLE_CALENDAR_API_KEY
      - GOOGLE_LOGIN_ENABLED
      - GOOGLE_API_CREDENTIALS
      - GOOGLE_WEBHOOK_TOKEN
      - GOOGLE_WEBHOOK_URL
      - MICROSOFT_WEBHOOK_TOKEN
      - MICROSOFT_WEBHOOK_URL

      # --- FEEDBACK / TRANSACTIONAL PROVIDERS -------------------------------------------------
      - SEND_FEEDBACK_EMAIL
      - SENDGRID_API_KEY
      - SENDGRID_EMAIL
      - NEXT_PUBLIC_SENDGRID_SENDER_NAME
      - SENDGRID_SYNC_API_KEY
      - RESEND_API_KEY

      # --- SENTRY -----------------------------------------------------------------------------
      - SENTRY_ORG
      - SENTRY_PROJECT
      - SENTRY_AUTH_TOKEN
      - NEXT_PUBLIC_SENTRY_DSN
      - NEXT_PUBLIC_SENTRY_DSN_CLIENT
      - SENTRY_DEBUG
      - SENTRY_MAX_SPANS
      - SENTRY_SAMPLE_RATE
      - SENTRY_TRACES_SAMPLE_RATE
      - SENTRY_REPLAYS_SESSION_SAMPLE_RATE
      - SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE

      # --- FORMBRICKS -------------------------------------------------------------------------
      - NEXT_PUBLIC_FORMBRICKS_HOST_URL
      - NEXT_PUBLIC_FORMBRICKS_ENVIRONMENT_ID
      - FORMBRICKS_FEEDBACK_SURVEY_ID

      # --- AVATARAPI --------------------------------------------------------------------------
      - AVATARAPI_USERNAME
      - AVATARAPI_PASSWORD

      # --- TWILIO -----------------------------------------------------------------------------
      - NEXT_PUBLIC_SENDER_ID
      - TWILIO_VERIFY_SID
      - TWILIO_OPT_OUT_ENABLED

      # --- STRIPE -----------------------------------------------------------------------------
      - NEXT_PUBLIC_STRIPE_PRO_PLAN_PRICE
      - NEXT_PUBLIC_STRIPE_PREMIUM_PLAN_PRICE
      - NEXT_PUBLIC_IS_PREMIUM_NEW_PLAN
      - NEXT_PUBLIC_STRIPE_PREMIUM_NEW_PLAN_PRICE
      - STRIPE_TEAM_MONTHLY_PRICE_ID
      - STRIPE_TEAM_ANNUAL_PRICE_ID
      - NEXT_PUBLIC_STRIPE_CREDITS_PRICE_ID
      - ORG_MONTHLY_CREDITS
      - STRIPE_TEAM_PRODUCT_ID
      - STRIPE_ORG_MONTHLY_PRICE_ID
      - STRIPE_ORG_ANNUAL_PRICE_ID
      - STRIPE_ORG_PRODUCT_ID
      - STRIPE_ORG_TRIAL_DAYS
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_WEBHOOK_SECRET_APPS
      - STRIPE_WEBHOOK_SECRET_BILLING
      - STRIPE_PRIVATE_KEY
      - STRIPE_CLIENT_ID
      - API_KEY_PREFIX

      # --- E-MAIL SETTINGS --------------------------------------------------------------------
      - EMAIL_FROM
      - EMAIL_FROM_NAME
      - EMAIL_SERVER_HOST
      - EMAIL_SERVER_PORT
      - EMAIL_SERVER_USER
      - EMAIL_SERVER_PASSWORD
      - AWAITING_PAYMENT_EMAIL_DELAY_MINUTES

      # --- BOT PROTECTION ---------------------------------------------------------------------
      - NEXT_PUBLIC_CLOUDFLARE_SITEKEY
      - NEXT_PUBLIC_CLOUDFLARE_USE_TURNSTILE_IN_BOOKER
      - CLOUDFLARE_TURNSTILE_SECRET
      - NEXT_PUBLIC_VERCEL_USE_BOTID_IN_BOOKER

      # --- CLOSE.COM INTERNAL CRM -------------------------------------------------------------
      - CLOSECOM_CLIENT_ID
      - CLOSECOM_CLIENT_SECRET

      # --- BRANDING ---------------------------------------------------------------------------
      - NEXT_PUBLIC_APP_NAME
      - NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS
      - NEXT_PUBLIC_COMPANY_NAME
      - NEXT_PUBLIC_DISABLE_SIGNUP
      - NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL
      - NEXT_PUBLIC_WEBSITE_TERMS_URL
      - NEXT_PUBLIC_HEAD_SCRIPTS
      - NEXT_PUBLIC_BODY_SCRIPTS
