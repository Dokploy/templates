      CREATE TABLE "ip_restriction_config" (
        "id" uuid DEFAULT gen_random_uuid() NOT NULL,
        "team_id" uuid NOT NULL UNIQUE,
        "allowed_ips" jsonb DEFAULT '[]' NOT NULL,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "updated_at" timestamp with time zone DEFAULT now() NOT NULL
      );
      --> statement-breakpoint
      CREATE TABLE "key_restriction_config" (
        "id" uuid DEFAULT gen_random_uuid() NOT NULL,
        "api_key_id" bigint NOT NULL UNIQUE,
        "team_id" uuid NOT NULL,
        "allowed_formats" jsonb DEFAULT '[]' NOT NULL,
        "allowed_endpoints" jsonb DEFAULT '[]' NOT NULL,
        "created_at" timestamp with time zone DEFAULT now() NOT NULL,
        "updated_at" timestamp with time zone DEFAULT now() NOT NULL,
        CONSTRAINT "allowed_formats_is_string_array" CHECK (jsonb_typeof("allowed_formats") = 'array' AND NOT jsonb_path_exists("allowed_formats", '$$[*] ? (@.type() != "string")')),
