[variables]
broker_domain = "${domain}"
mqtt_username = "mqtt"
mqtt_password = "${password:32}"

[config]
env = [
  "MQTT_DOMAIN=${broker_domain}",
  "MQTT_USERNAME=${mqtt_username}",
  "MQTT_PASSWORD=${mqtt_password}"
]

[[config.domains]]
serviceName = "hivemq-ce"
port = 8000
host = "${broker_domain}"

[[config.mounts]]
filePath = "config.xml"
content = """
<?xml version="1.0" encoding="UTF-8"?>
<hivemq>
  <listeners>
    <tcp-listener>
      <port>1883</port>
      <bind-address>0.0.0.0</bind-address>
    </tcp-listener>
    <websocket-listener>
      <port>8000</port>
      <bind-address>0.0.0.0</bind-address>
      <path>/mqtt</path>
      <subprotocols>
        <subprotocol>mqttv3.1</subprotocol>
        <subprotocol>mqtt</subprotocol>
      </subprotocols>
    </websocket-listener>
  </listeners>
  <persistence><mode>file</mode></persistence>
</hivemq>
"""
