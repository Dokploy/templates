version: "3.8"

services:
  heyo-docs:
    build:
      context: https://github.com/heyo-sh/heyo-docs.git#main
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL}
    restart: unless-stopped
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
