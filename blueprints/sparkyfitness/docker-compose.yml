services:
  sparkyfitness:
    image: codewithcj/sparkyfitness:v1.12.1
    restart: unless-stopped
    depends_on:
      - server
    environment:
      - SPARKY_FITNESS_FRONTEND_URL=https://${main_domain}
      # The frontend's built-in nginx proxies /api to the server service.
      - SPARKY_FITNESS_SERVER_HOST=server
      - SPARKY_FITNESS_SERVER_PORT=3010
      - NGINX_LISTEN_PORT=80
    expose:
      - "80"

  server:
    image: codewithcj/sparkyfitness_server:v1.12.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPARKY_FITNESS_DB_HOST=postgres
      - SPARKY_FITNESS_DB_PORT=5432
      - SPARKY_FITNESS_DB_NAME=sparkyfitness_db
      - SPARKY_FITNESS_DB_USER=sparky
      - SPARKY_FITNESS_DB_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      # The server creates and manages this application role itself.
      - SPARKY_FITNESS_APP_DB_USER=sparky_app
      - SPARKY_FITNESS_APP_DB_PASSWORD=${SPARKY_FITNESS_APP_DB_PASSWORD}
      # 64-char hex key (see template.toml); encrypts stored API credentials.
      - SPARKY_FITNESS_API_ENCRYPTION_KEY=${SPARKY_FITNESS_API_ENCRYPTION_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SPARKY_FITNESS_FRONTEND_URL=https://${main_domain}
      - SPARKY_FITNESS_SERVER_PORT=3010
      - NODE_ENV=production
    volumes:
      - uploads:/app/SparkyFitnessServer/uploads
      - backup:/app/SparkyFitnessServer/backup

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sparkyfitness_db
      - POSTGRES_USER=sparky
      - POSTGRES_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker, so the
      # volume mounts the parent directory (mounting .../data would not
      # persist anything on this major version).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  backup:
  pgdata:
