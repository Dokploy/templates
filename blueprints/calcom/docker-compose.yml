      - NEXT_PUBLIC_ORGANIZATIONS_MIN_SELF_SERVE_SEATS
      - NEXT_PUBLIC_ORGANIZATIONS_SELF_SERVE_PRICE_NEW
      - ORGANIZATIONS_AUTOLINK
      - NEXT_PUBLIC_SINGLE_ORG_SLUG
      - PROJECT_ID_VERCEL
