[variables]
main_domain = "${domain}"
stream_domain = "${domain}"
app_key = "${base64:32}"
browser_stream_secret = "${hash:32}"
pinokio_token = "${hash:32}"
postgres_user = "${username}"
postgres_password = "${password:32}"
postgres_database = "puppetflow"
instance_id = "${hash:8}"

[config]

[[config.domains]]
serviceName = "puppetflow"
port = 8000
host = "${main_domain}"
https = true
certificateType = "letsencrypt"

[[config.domains]]
serviceName = "stream-server"
port = 6080
host = "${stream_domain}"
https = true
certificateType = "letsencrypt"

[config.env]
APP_URL = "https://${main_domain}"
APP_KEY = "base64:${app_key}"
BROWSER_STREAM_PUBLIC_URL = "https://${stream_domain}"
BROWSER_STREAM_SECRET = "${browser_stream_secret}"
PINOKIO_TOKEN = "${pinokio_token}"
POSTGRES_USER = "${postgres_user}"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_DB = "${postgres_database}"
PUPPETFLOW_INSTANCE_ID = "${instance_id}"
