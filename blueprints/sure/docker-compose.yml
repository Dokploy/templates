services:
  sure:
    image: ghcr.io/we-promise/sure:0.7.6-hotfix.2
    restart: unless-stopped
    expose:
      - 3000
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure}
      REDIS_URL: redis://redis:6379/1
      DB_HOST: postgresql
      DB_PORT: "5432"
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sure-app-storage:/rails/storage
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "X-Forwarded-Proto: https",
          "http://127.0.0.1:3000/up",
        ]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 120s

  worker:
    image: ghcr.io/we-promise/sure:0.7.6-hotfix.2
    restart: unless-stopped
    command: bundle exec sidekiq
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure}
      REDIS_URL: redis://redis:6379/1
      DB_HOST: postgresql
      DB_PORT: "5432"
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
    volumes:
      - sure-app-storage:/rails/storage
    depends_on:
      sure:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "sidekiq"]
      interval: 15s
      timeout: 20s
      retries: 5

  postgresql:
    image: postgres:16.16-alpine
    restart: unless-stopped
    volumes:
      - sure-postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:8.12.0-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - sure-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  sure-app-storage:
  sure-postgresql-data:
  sure-redis:
