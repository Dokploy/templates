# Native MQTT over TLS requires a Traefik TCP entrypoint named "mqtts"
# on port 8883 and a corresponding port mapping on the Traefik container.
# WebSocket clients connect using wss://<broker_domain>/mqtt via Dokploy HTTPS.
services:
  hivemq-ce-init:
    image: curlimages/curl:8.22.0
    restart: "no"
    user: "0:0"
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${MQTT_USERNAME:?MQTT_USERNAME is required}"
        : "$${MQTT_PASSWORD:?MQTT_PASSWORD is required}"
        case "$$MQTT_USERNAME" in
          *[!a-zA-Z0-9_.-]*) echo 'Invalid MQTT username' >&2; exit 1 ;;
        esac

        extension=/extensions/hivemq-file-rbac-extension
        work_dir=$$(mktemp -d)
        trap 'rm -rf "$$work_dir"' EXIT
        if [ ! -f "$$extension/hivemq-file-rbac-extension-4.6.17.jar" ]; then
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$$work_dir/rbac.zip" \
            https://github.com/hivemq/hivemq-file-rbac-extension/releases/download/4.6.17/hivemq-file-rbac-extension-4.6.17.zip
          unzip -oq "$$work_dir/rbac.zip" -d "$$work_dir"
          test -f "$$work_dir/hivemq-file-rbac-extension/hivemq-extension.xml"
          mkdir -p "$$extension"
          cp -R "$$work_dir/hivemq-file-rbac-extension/." "$$extension/"
        fi

        # The CE image enables anonymous MQTT by default. Never retain that extension.
        rm -rf /extensions/hivemq-allow-all-extension

        escape_xml() {
          printf '%s' "$$1" | sed \
            -e 's/\&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
            -e 's/"/\&quot;/g' -e "s/'/\&apos;/g"
        }
        username=$$(escape_xml "$$MQTT_USERNAME")
        password=$$(escape_xml "$$MQTT_PASSWORD")
        cat > "$$extension/extension-config.xml" <<'CONFIG'
        <?xml version="1.0" encoding="UTF-8"?>
        <extension-configuration>
          <password-type>PLAIN</password-type>
          <next-extension-instead-of-fail>false</next-extension-instead-of-fail>
        </extension-configuration>
        CONFIG

        credentials=$$(mktemp "$$extension/.credentials.XXXXXX")
        cat > "$$credentials" <<CREDENTIALS
        <?xml version="1.0" encoding="UTF-8"?>
        <file-rbac>
          <users>
            <user>
              <name>$$username</name>
              <password>$$password</password>
              <roles><id>mqtt</id></roles>
            </user>
          </users>
          <roles>
            <role>
              <id>mqtt</id>
              <permissions><permission><topic>#</topic></permission></permissions>
            </role>
          </roles>
        </file-rbac>
        CREDENTIALS
        chown -R 10000:10000 "$$extension"
        chmod 600 "$$credentials"
        mv -f "$$credentials" "$$extension/credentials.xml"
    volumes:
      - hivemq_extensions:/extensions

  hivemq-ce:
    image: hivemq/hivemq-ce:2026.5
    restart: unless-stopped
    depends_on:
      hivemq-ce-init:
        condition: service_completed_successfully
    environment:
      - HIVEMQ_ALLOW_ALL_CLIENTS=false
    entrypoint:
      - /bin/bash
      - -ec
      - |
        test -f /opt/hivemq/extensions/hivemq-file-rbac-extension/hivemq-extension.xml
        test -f /opt/hivemq/extensions/hivemq-file-rbac-extension/hivemq-file-rbac-extension-4.6.17.jar
        test -f /opt/hivemq/extensions/hivemq-file-rbac-extension/credentials.xml
        test ! -e /opt/hivemq/extensions/hivemq-allow-all-extension
        exec /opt/docker-entrypoint.sh /opt/hivemq/bin/run.sh
    expose:
      - 1883 # MQTT over TCP (TLS terminated by Traefik on 8883)
      - 8000 # MQTT over WebSockets (WSS via Dokploy HTTPS, path /mqtt)
    volumes:
      - ../files/config.xml:/opt/hivemq/conf/config.xml:ro
      - hivemq_data:/opt/hivemq/data
      - hivemq_log:/opt/hivemq/log
      - hivemq_extensions:/opt/hivemq/extensions
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1883'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.tcp.routers.hivemq-ce-mqtts.entrypoints=mqtts"
      - "traefik.tcp.routers.hivemq-ce-mqtts.rule=HostSNI(`${MQTT_DOMAIN}`)"
      - "traefik.tcp.routers.hivemq-ce-mqtts.tls=true"
      - "traefik.tcp.routers.hivemq-ce-mqtts.tls.certresolver=letsencrypt"
      - "traefik.tcp.routers.hivemq-ce-mqtts.service=hivemq-ce-mqtts"
      - "traefik.tcp.services.hivemq-ce-mqtts.loadbalancer.server.port=1883"

volumes:
  hivemq_data:
  hivemq_log:
  hivemq_extensions:
