services:
  pretix:
    image: pretix/standalone:2026.8.0
    restart: unless-stopped
    command: ["all"]
    expose:
      - 80
    environment:
      PRETIX_PRETIX_INSTANCE_NAME: ${PRETIX_INSTANCE_NAME:-pretix}
      PRETIX_PRETIX_URL: ${PRETIX_URL:?required}
      PRETIX_PRETIX_CURRENCY: ${PRETIX_CURRENCY:-EUR}
      PRETIX_PRETIX_DATADIR: /data
      PRETIX_PRETIX_TRUST_X_FORWARDED_FOR: "on"
      PRETIX_PRETIX_TRUST_X_FORWARDED_PROTO: "on"
      PRETIX_DJANGO_SECRET: ${PRETIX_SECRET_KEY:?required}
      PRETIX_DATABASE_BACKEND: postgresql
      PRETIX_DATABASE_NAME: pretix
      PRETIX_DATABASE_USER: pretix
      PRETIX_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      PRETIX_DATABASE_HOST: postgres
      PRETIX_DATABASE_PORT: "5432"
      PRETIX_REDIS_LOCATION: redis://redis:6379/0
      PRETIX_REDIS_SESSIONS: "true"
      PRETIX_CELERY_BACKEND: redis://redis:6379/1
      PRETIX_CELERY_BROKER: redis://redis:6379/2
      PRETIX_MAIL_FROM: ${PRETIX_MAIL_FROM:-tickets@example.com}
      PRETIX_MAIL_HOST: ${PRETIX_MAIL_HOST:-localhost}
      PRETIX_MAIL_PORT: ${PRETIX_MAIL_PORT:-25}
      PRETIX_MAIL_USER: ${PRETIX_MAIL_USER:-}
      PRETIX_MAIL_PASSWORD: ${PRETIX_MAIL_PASSWORD:-}
      PRETIX_MAIL_TLS: ${PRETIX_MAIL_TLS:-false}
    volumes:
      - pretix-data:/data
      - pretix-config:/etc/pretix
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pretix
      POSTGRES_DB: pretix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pretix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix -d pretix"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - pretix-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pretix-data: {}
  pretix-config: {}
  pretix-postgres: {}
  pretix-redis: {}
