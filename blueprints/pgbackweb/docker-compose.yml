services:
  pgbackweb:
    image: eduardolat/pgbackweb:0.5.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Both values are generated by Dokploy at deploy time (see
      # template.toml). Never change PBW_ENCRYPTION_KEY after the first
      # deploy: it encrypts the credentials PG Back Web stores, and
      # changing it makes the stored data unreadable.
      - PBW_ENCRYPTION_KEY=${PBW_ENCRYPTION_KEY}
      - PBW_POSTGRES_CONN_STRING=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/pgbackweb?sslmode=disable
    volumes:
      # Local backup files live here. Not needed if you only use S3
      # destinations, but harmless to keep.
      - backups:/backups
    expose:
      - "8085"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=pgbackweb
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker, so the
      # volume mounts the parent /var/lib/postgresql (upstream's README
      # example still mounts the pre-18 path).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backups:
  pgdata:
